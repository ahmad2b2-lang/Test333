<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#f6f7f9">
<title>Plan Review</title>
<style>
  :root{color-scheme:light only;--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--muted:#6b7385;--line:#e6e9ef;--blue:#2f6fed;--green:#1f9d55;--amber:#c27c0e;--red:#d64545}
  *{box-sizing:border-box}
  html,body{margin:0;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh}
  input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
  input,textarea,select{font-size:16px;font-family:inherit;color:inherit}
  button{font-family:inherit;font-size:16px;cursor:pointer;border:0;background:none;color:inherit}
  .hidden{display:none!important}

  header{position:sticky;top:0;z-index:5;background:rgba(246,247,249,.95);backdrop-filter:blur(8px);
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
  header h1{flex:1;margin:0;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icon-btn{min-width:44px;min-height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted)}
  .icon-btn:active{background:#eceff4}
  main{max-width:640px;margin:0 auto;padding:14px 14px calc(110px + env(safe-area-inset-bottom))}

  /* PIN */
  #pinView{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  #pinView h2{margin:0 0 6px;font-size:22px}
  #pinView p{margin:0 0 22px;color:var(--muted);min-height:20px}
  .dots{display:flex;gap:14px;margin-bottom:28px}
  .dot{width:16px;height:16px;border-radius:50%;border:2px solid #b8c0cf}
  .dot.on{background:var(--blue);border-color:var(--blue)}
  .pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
  .pad button{height:76px;border-radius:50%;background:#fff;font-size:26px;font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .pad button:active{background:#e8eefc}
  .pad .ghost{background:none;box-shadow:none;font-size:20px;color:var(--muted)}
  .err{color:var(--red)!important}

  /* List */
  .plan-card{display:block;width:100%;text-align:left;background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .plan-card:active{transform:scale(.99)}
  .plan-card h3{margin:0 0 6px;font-size:17px}
  .plan-card p{margin:0 0 10px;color:var(--muted);font-size:14px;line-height:1.4}
  .meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
  .chip.new{background:#e6eefe;color:var(--blue)}
  .chip.saved{background:#fdf1dc;color:var(--amber)}
  .chip.approved{background:#e2f5ea;color:var(--green)}
  .chip.built{background:#eceff4;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;line-height:1.6;white-space:pre-line}

  /* Plan */
  .intro{color:var(--muted);font-size:14px;line-height:1.45;margin:2px 4px 12px}
  .stats{display:flex;flex-wrap:wrap;gap:6px;margin:0 2px 14px}
  .stats span{background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:12px;color:var(--muted)}
  .section{background:var(--card);border-radius:16px;padding:6px 6px 8px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .sec-head{display:flex;align-items:center;gap:6px;padding:10px 10px 4px}
  .sec-num{font-weight:700;color:var(--blue);font-size:15px}
  .sec-title{font-weight:700;font-size:16px;flex:1}
  input.sec-title{border:0;border-bottom:2px dashed var(--line);padding:4px 2px;background:none;outline:none}
  .item{display:flex;align-items:flex-start;gap:4px;padding:2px 4px;border-radius:12px}
  .item.off .txt{color:#a3abba;text-decoration:line-through}
  .tick{flex:0 0 44px;height:44px;display:flex;align-items:center;justify-content:center}
  .tick i{width:24px;height:24px;border-radius:7px;border:2px solid #b8c0cf;display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff;font-size:15px;font-weight:700}
  .item:not(.off) .tick i{background:var(--blue);border-color:var(--blue)}
  .num{flex:0 0 auto;padding-top:12px;font-size:13px;color:var(--muted);min-width:26px}
  .txt{flex:1;border:0;resize:none;background:none;outline:none;line-height:1.4;padding:11px 4px;min-height:44px;overflow:hidden;border-radius:8px}
  .txt:focus{background:#f3f6fc}
  .tag{flex:0 0 auto;align-self:center;font-size:11px;font-weight:600;border-radius:99px;padding:4px 8px;min-height:28px}
  .tag.edited{background:#fdf1dc;color:var(--amber)}
  .tag.added{background:#e2f5ea;color:var(--green)}
  .del{flex:0 0 36px;height:44px;color:#b8c0cf;font-size:18px}
  .add{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 14px;color:var(--blue);font-weight:600;font-size:15px;border-radius:12px}
  .add:active{background:#eef3fd}
  .add-sec{background:#fff;border:2px dashed #cfd6e3;border-radius:16px;justify-content:center;margin-bottom:14px}
  .notes{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .notes label{display:block;font-weight:700;margin-bottom:8px}
  .notes textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:10px;resize:vertical;outline:none;line-height:1.4}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.97);border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
  .bar button{flex:1;max-width:300px;min-height:50px;border-radius:14px;font-weight:700}
  .btn-sec{background:#eceff4;color:var(--ink)}
  .btn-pri{background:var(--green);color:#fff}
  .bar button:active,.sheet button:active{transform:scale(.97)}
  .unsaved{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:var(--amber);color:#fff;font-size:12px;font-weight:600;padding:4px 12px;border-radius:99px;z-index:6}

  /* sheet + toast */
  .shade{position:fixed;inset:0;background:rgba(20,25,35,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom))}
  .sheet h3{margin:0 0 8px;font-size:19px}
  .sheet p{margin:0 0 14px;color:var(--muted);line-height:1.45}
  .say{display:flex;align-items:center;gap:8px;background:#f3f6fc;border-radius:12px;padding:10px 12px;margin-bottom:16px}
  .say span{flex:1;-webkit-user-select:text;user-select:text;font-weight:600}
  .say button{min-height:40px;padding:0 12px;border-radius:10px;background:var(--blue);color:#fff;font-size:14px;font-weight:600}
  .sheet .row{display:flex;gap:10px}
  .sheet .row button{flex:1;min-height:50px;border-radius:14px;font-weight:700}
  .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);background:#1d2330;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90%;text-align:center}
  .loading{text-align:center;color:var(--muted);padding:60px 0}
</style>
</head>
<body>

<!-- PIN screen -->
<div id="pinView" class="hidden">
  <h2 id="pinTitle">Enter PIN</h2>
  <p id="pinMsg">&nbsp;</p>
  <div class="dots" id="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div class="pad" id="pad"></div>
</div>

<!-- App -->
<div id="appView" class="hidden">
  <header>
    <button class="icon-btn hidden" id="backBtn" aria-label="Back">‹</button>
    <h1 id="hTitle">Plans</h1>
    <button class="icon-btn" id="refreshBtn" aria-label="Refresh">⟳</button>
    <button class="icon-btn" id="lockBtn" aria-label="Lock">🔒</button>
  </header>
  <main id="main"></main>
  <div class="bar hidden" id="bar">
    <button class="btn-sec" id="saveBtn">Save draft</button>
    <button class="btn-pri" id="approveBtn">Approve ✓</button>
  </div>
  <div class="unsaved hidden" id="unsaved">Unsaved changes</div>
</div>

<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});

const sb=supabase.createClient('https://bhfgwlkzkbwcwyoypwhy.supabase.co','sb_publishable_9YylflVQca-62NHsBKSTeA_GY896nj3');
const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

let PIN=store.get('planPin');
let plan=null, dirty=false;
const STATUS={new:'New',saved:'Draft saved',approved:'Approved',built:'Built'};
const ERR={wrong_pin:'Wrong PIN',locked:'Too many wrong tries. Wait 15 minutes.',no_pin:'No PIN set yet',not_found:'Plan not found',bad_data:'Could not save this data'};

function toast(msg,ms=2200){const t=el('div','toast',msg);$('toastRoot').appendChild(t);setTimeout(()=>t.remove(),ms);}
async function rpc(name,args){
  const {data,error}=await sb.rpc(name,args);
  if(error) return {ok:false,error:'net',msg:'Connection problem. Try again.'};
  return data;
}
function errText(r){return r.msg||ERR[r.error]||'Something went wrong';}
function handleAuthErr(r){
  if(r.error==='wrong_pin'||r.error==='no_pin'||r.error==='locked'){PIN=null;store.del('planPin');showPin(errText(r));return true;}
  return false;
}

/* ---------- PIN ---------- */
let pinMode='enter', pinBuf='', pinFirst='';
function showPin(msg){
  $('appView').classList.add('hidden');$('pinView').classList.remove('hidden');
  pinBuf='';drawDots();
  rpc('plan_pin_status',{}).then(r=>{
    pinMode=(r&&r.has_pin===false)?'create':'enter';pinFirst='';
    $('pinTitle').textContent=pinMode==='create'?'Create a 4-digit PIN':'Enter PIN';
    setPinMsg(msg||(pinMode==='create'?'You will use it to open your plans':' '),!!msg);
  });
}
function setPinMsg(m,isErr){const p=$('pinMsg');p.textContent=m;p.classList.toggle('err',!!isErr);}
function drawDots(){[...$('dots').children].forEach((d,i)=>d.classList.toggle('on',i<pinBuf.length));}
(function buildPad(){
  const keys=['1','2','3','4','5','6','7','8','9','','0','⌫'];
  keys.forEach(k=>{const b=el('button',k===''||k==='⌫'?'ghost':'',k);if(k==='')b.disabled=true;
    b.addEventListener('click',()=>pinKey(k));$('pad').appendChild(b);});
})();
async function pinKey(k){
  if(k==='')return;
  if(k==='⌫'){pinBuf=pinBuf.slice(0,-1);drawDots();return;}
  if(pinBuf.length>=4)return;
  pinBuf+=k;drawDots();
  if(pinBuf.length<4)return;
  const entered=pinBuf;
  if(pinMode==='create'){
    if(!pinFirst){pinFirst=entered;pinBuf='';setTimeout(drawDots,150);setPinMsg('Enter it again to confirm');return;}
    if(pinFirst!==entered){pinFirst='';pinBuf='';setTimeout(drawDots,150);setPinMsg('PINs did not match. Start again.',true);return;}
    const r=await rpc('plan_set_pin',{p_pin:entered});
    if(!r.ok){pinBuf='';drawDots();setPinMsg(r.error==='pin_exists'?'A PIN already exists. Enter it.':errText(r),true);if(r.error==='pin_exists'){pinMode='enter';$('pinTitle').textContent='Enter PIN';}return;}
  }
  setPinMsg('Checking…');
  const r=await rpc('plan_list',{p_pin:entered});
  if(!r.ok){pinBuf='';setTimeout(drawDots,150);setPinMsg(errText(r),true);return;}
  PIN=entered;store.set('planPin',PIN);
  $('pinView').classList.add('hidden');$('appView').classList.remove('hidden');
  route(r);
}

/* ---------- Routing ---------- */
function currentId(){return new URLSearchParams(location.search).get('id');}
function go(id){history.pushState({},'',id?('?id='+encodeURIComponent(id)):location.pathname);route();}
window.addEventListener('popstate',()=>{
  if(dirty&&plan){const keep=plan.id;history.pushState({},'','?id='+encodeURIComponent(keep));leave(()=>go(null));return;}
  route();
});
async function route(prefetchedList){
  const id=currentId();
  if(id) openPlan(id); else showList(prefetchedList);
}

/* ---------- List ---------- */
async function showList(pre){
  plan=null;setDirty(false);
  $('hTitle').textContent='Plans';$('backBtn').classList.add('hidden');$('bar').classList.add('hidden');
  const main=$('main');main.innerHTML='';main.appendChild(el('div','loading','Loading…'));
  const r=(pre&&pre.ok)?pre:await rpc('plan_list',{p_pin:PIN});
  if(!r.ok){if(!handleAuthErr(r)){main.innerHTML='';main.appendChild(el('div','empty',errText(r)));}return;}
  main.innerHTML='';
  if(!r.plans.length){main.appendChild(el('div','empty','No plans yet.\nAsk Claude to prepare a plan for your next app — it will appear here.'));return;}
  r.plans.forEach(p=>{
    const c=el('button','plan-card');
    c.appendChild(el('h3',null,p.title));
    if(p.summary)c.appendChild(el('p',null,p.summary));
    const m=el('div','meta');m.appendChild(el('span','chip '+p.status,STATUS[p.status]||p.status));
    m.appendChild(el('span',null,fmtDate(p.updated_at)));c.appendChild(m);
    c.addEventListener('click',()=>go(p.id));
    main.appendChild(c);
  });
}
function fmtDate(s){const d=new Date(s);return d.toLocaleDateString(undefined,{day:'numeric',month:'short'})+' · '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});}

/* ---------- Plan ---------- */
async function openPlan(id){
  $('backBtn').classList.remove('hidden');$('hTitle').textContent='Plan';
  const main=$('main');main.innerHTML='';main.appendChild(el('div','loading','Loading…'));
  const r=await rpc('plan_get',{p_pin:PIN,p_id:id});
  if(!r.ok){if(!handleAuthErr(r)){main.innerHTML='';main.appendChild(el('div','empty',errText(r)));}return;}
  plan=r.plan;
  (plan.sections||[]).forEach(s=>{s.items=s.items||[];s.items.forEach(it=>{if(it.on===undefined)it.on=true;if(it.orig===undefined)it.orig=it.text;});});
  setDirty(false);renderPlan();
}
function setDirty(v){dirty=v;$('unsaved').classList.toggle('hidden',!v);}
function touch(){if(!dirty)setDirty(true);drawStats();}

function renderPlan(){
  $('hTitle').textContent=plan.title;$('bar').classList.remove('hidden');
  const main=$('main');main.innerHTML='';
  const top=el('div','meta');top.style.margin='0 4px 8px';
  top.appendChild(el('span','chip '+plan.status,STATUS[plan.status]||plan.status));
  top.appendChild(el('span',null,'Updated '+fmtDate(plan.updated_at)));main.appendChild(top);
  main.appendChild(el('div','intro',(plan.summary?plan.summary+' ':'')+'Tap a box to keep or drop a bullet. Tap text to edit it.'));
  const st=el('div','stats');st.id='stats';main.appendChild(st);
  plan.sections.forEach((s,si)=>main.appendChild(renderSection(s,si)));
  const addSec=el('button','add add-sec','+ Add section');
  addSec.addEventListener('click',()=>{
    plan.sections.push({id:'ns'+Date.now(),title:'',added:true,items:[]});touch();renderPlan();
    const inputs=document.querySelectorAll('input.sec-title');const last=inputs[inputs.length-1];if(last){last.focus();last.scrollIntoView({block:'center'});}
  });
  main.appendChild(addSec);
  const n=el('div','notes');n.appendChild(el('label',null,'Notes for Claude'));
  const ta=el('textarea');ta.placeholder='Anything else Claude should know before building…';ta.value=plan.notes||'';
  ta.addEventListener('input',()=>{plan.notes=ta.value;touch();});n.appendChild(ta);main.appendChild(n);
  drawStats();
}
function renderSection(s,si){
  const box=el('div','section');
  const h=el('div','sec-head');h.appendChild(el('span','sec-num',(si+1)+'.'));
  if(s.added){
    const inp=el('input','sec-title');inp.placeholder='Section name';inp.value=s.title||'';
    inp.addEventListener('input',()=>{s.title=inp.value;touch();});h.appendChild(inp);
    const d=el('button','del','✕');d.setAttribute('aria-label','Remove section');
    d.addEventListener('click',()=>{plan.sections.splice(si,1);touch();renderPlan();});h.appendChild(d);
  } else h.appendChild(el('span','sec-title',s.title));
  box.appendChild(h);
  const list=el('div');
  s.items.forEach((it,ii)=>list.appendChild(renderItem(s,si,it,ii)));
  box.appendChild(list);
  const add=el('button','add','+ Add bullet');
  add.addEventListener('click',()=>{
    const it={id:'n'+Date.now(),text:'',on:true,orig:'',added:true};s.items.push(it);touch();
    const row=renderItem(s,si,it,s.items.length-1);list.appendChild(row);row.querySelector('textarea').focus();
  });
  box.appendChild(add);
  return box;
}
function renderItem(s,si,it,ii){
  const row=el('div','item'+(it.on?'':' off'));
  const t=el('button','tick');t.setAttribute('aria-label','Keep or drop');const i=el('i',null,'✓');t.appendChild(i);
  t.addEventListener('click',()=>{it.on=!it.on;row.classList.toggle('off',!it.on);touch();});
  row.appendChild(t);
  row.appendChild(el('span','num',(si+1)+'.'+(ii+1)));
  const ta=el('textarea','txt');ta.rows=1;ta.value=it.text;if(it.added)ta.placeholder='Type your bullet…';
  const tagBox=el('span');
  const drawTag=()=>{tagBox.innerHTML='';
    if(it.added){const d=el('button','del','✕');d.setAttribute('aria-label','Remove bullet');
      d.addEventListener('click',()=>{s.items.splice(s.items.indexOf(it),1);touch();renderPlan();});tagBox.appendChild(d);}
    else if(it.text!==it.orig){const g=el('button','tag edited','edited ↺');g.title='Tap to undo the edit';
      g.addEventListener('click',()=>{it.text=it.orig;ta.value=it.orig;grow(ta);touch();drawTag();});tagBox.appendChild(g);}
  };
  ta.addEventListener('input',()=>{it.text=ta.value;grow(ta);touch();drawTag();});
  row.appendChild(ta);row.appendChild(tagBox);drawTag();
  requestAnimationFrame(()=>grow(ta));
  return row;
}
function grow(ta){ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';}
window.addEventListener('resize',()=>document.querySelectorAll('.txt').forEach(grow));

function counts(){
  let kept=0,dropped=0,added=0,edited=0;
  plan.sections.forEach(s=>s.items.forEach(it=>{
    if(it.added){if(it.text.trim()){added++;if(it.on)kept++;else dropped++;}return;}
    if(it.on)kept++;else dropped++;
    if(it.text!==it.orig)edited++;
  }));
  return {kept,dropped,added,edited};
}
function drawStats(){
  const st=$('stats');if(!st||!plan)return;const c=counts();st.innerHTML='';
  [['kept',c.kept],['dropped',c.dropped],['added',c.added],['edited',c.edited]].forEach(([k,v])=>st.appendChild(el('span',null,v+' '+k)));
}

function cleaned(){
  return plan.sections
    .map(s=>({...s,title:(s.title||'').trim(),items:s.items.filter(it=>!it.added||it.text.trim()).map(it=>({...it,text:it.text.trim()?it.text:it.orig}))}))
    .filter(s=>!s.added||s.title||s.items.length)
    .map(s=>s.added&&!s.title?{...s,title:'Extra'}:s);
}
async function save(approve){
  const btns=[$('saveBtn'),$('approveBtn')];btns.forEach(b=>b.disabled=true);
  const sections=cleaned();
  const r=await rpc('plan_save',{p_pin:PIN,p_id:plan.id,p_sections:sections,p_notes:plan.notes||'',p_approve:!!approve});
  btns.forEach(b=>b.disabled=false);
  if(!r.ok){if(!handleAuthErr(r))toast(errText(r));return false;}
  plan.sections=sections;plan.status=r.status;plan.updated_at=r.updated_at;setDirty(false);renderPlan();
  return true;
}
$('saveBtn').addEventListener('click',async()=>{if(await save(false))toast('Draft saved ✓');});
$('approveBtn').addEventListener('click',()=>{
  sheet('Approve this plan?','Claude will build only the ticked bullets, with your edits, additions and notes.',
    [['Cancel','btn-sec',null],['Approve','btn-pri',async()=>{if(await save(true))showSay();}]]);
});
function showSay(){
  const msg='Proceed with plan: '+plan.title;
  const root=$('sheetRoot');root.innerHTML='';
  const shade=el('div','shade');const sh=el('div','sheet');
  sh.appendChild(el('h3',null,'Approved ✓'));
  sh.appendChild(el('p',null,'Now go back to Claude and send this message:'));
  const say=el('div','say');say.appendChild(el('span',null,msg));
  const cp=el('button',null,'Copy');cp.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(msg);cp.textContent='Copied ✓';}catch(e){cp.textContent='Copy failed';}});
  say.appendChild(cp);sh.appendChild(say);
  const row=el('div','row');const ok=el('button','btn-sec','Done');ok.addEventListener('click',()=>root.innerHTML='');row.appendChild(ok);sh.appendChild(row);
  shade.appendChild(sh);shade.addEventListener('click',e=>{if(e.target===shade)root.innerHTML='';});root.appendChild(shade);
}
function sheet(title,text,buttons){
  const root=$('sheetRoot');root.innerHTML='';
  const shade=el('div','shade');const sh=el('div','sheet');
  sh.appendChild(el('h3',null,title));sh.appendChild(el('p',null,text));
  const row=el('div','row');
  buttons.forEach(([label,cls,fn])=>{const b=el('button',cls,label);b.addEventListener('click',async()=>{root.innerHTML='';if(fn)await fn();});row.appendChild(b);});
  sh.appendChild(row);shade.appendChild(sh);
  shade.addEventListener('click',e=>{if(e.target===shade)root.innerHTML='';});
  root.appendChild(shade);
}

/* ---------- Header buttons ---------- */
function leave(fn){
  if(!dirty)return fn();
  sheet('Unsaved changes','Save your changes before leaving?',[
    ['Discard','btn-sec',()=>{setDirty(false);fn();}],
    ['Save','btn-pri',async()=>{if(await save(false))fn();}]
  ]);
}
$('backBtn').addEventListener('click',()=>leave(()=>go(null)));
$('refreshBtn').addEventListener('click',()=>leave(()=>route()));
$('lockBtn').addEventListener('click',()=>leave(()=>{PIN=null;store.del('planPin');showPin();}));
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});

/* ---------- Start ---------- */
if(PIN){$('appView').classList.remove('hidden');route();} else showPin();
</script>
