<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#f7f7f5">
<title>أنماط القدرات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Calm by design: one accent colour, green/red only for right/wrong, one thing per screen. */
  :root{
    color-scheme:light only;
    --bg:#f7f7f5; --card:#fff; --ink:#1f2328; --muted:#6b7280; --faint:#9aa0a8; --line:#e7e7e3;
    --accent:#2563eb; --accentSoft:#eaf0fd;
    --ok:#16a34a; --okSoft:#eaf7ee; --bad:#dc2626; --badSoft:#fdeeee;
  }
  *{box-sizing:border-box}
  html,body{margin:0;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
  body{
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    background:var(--bg);color:var(--ink);min-height:100dvh;font-size:17px;line-height:1.7;
  }
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  #app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
       padding:calc(env(safe-area-inset-top) + 10px) 20px calc(env(safe-area-inset-bottom) + 20px)}

  /* top bar */
  .top{display:flex;align-items:center;gap:12px;min-height:48px;margin-bottom:18px}
  .x{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:18px;color:var(--muted);flex:none}
  .x:active{background:#eeeeea}
  .prog{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
  .prog i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
  .pnum{font-size:14px;color:var(--muted);min-width:44px;text-align:left}

  .screen{flex:1;display:flex;flex-direction:column}
  h1{font-size:22px;margin:0}
  h2{font-size:21px;margin:0 0 4px;line-height:1.5}
  .sub{color:var(--muted);font-size:15px;margin:0 0 18px}
  .bottom{margin-top:auto;padding-top:20px;display:flex;flex-direction:column;gap:6px}
  .btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border-radius:14px;font-weight:700;font-size:17px;background:var(--accent);color:#fff}
  .btn:active{transform:scale(.98)}
  .btn:disabled{background:#d6d9de;color:#fff}
  .link{min-height:44px;color:var(--muted);font-weight:600;font-size:15px;align-self:center;padding:0 12px}
  .link:disabled{opacity:.4}

  /* the question: one quiet card, nothing nested */
  .q{background:var(--card);border-radius:18px;padding:22px 18px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .q .stem{color:var(--muted);font-size:16px;line-height:2.1;margin-bottom:14px;text-align:center}
  .q .vs{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;font-size:24px;font-weight:700;line-height:2.1}
  .q .vs .or{font-size:14px;font-weight:500;color:var(--faint)}
  .q .pair{font-size:30px;font-weight:700;text-align:center;word-spacing:6px}
  .q.small{padding:12px 14px}
  .q.small .stem{margin-bottom:4px;font-size:14px;line-height:1.8}
  .q.small .vs{font-size:18px;gap:10px;line-height:1.8}
  .q.small .pair{font-size:21px}
  .skel{font-size:17px;font-weight:600;text-align:center;color:var(--muted);padding:6px 0}

  .tok{border-radius:5px;padding:0 3px}
  .tok.tap{border-bottom:1.5px dashed #c8ccd2;cursor:pointer}
  .tok.hit{background:var(--accentSoft);box-shadow:inset 0 -2px 0 var(--accent);border-bottom-color:transparent}
  .tok.missed{box-shadow:inset 0 -2px 0 var(--bad);border-bottom-color:transparent}
  .tok.shake{animation:shake .35s}
  .tok.pulse{animation:pulse .8s 3}
  @keyframes shake{25%,75%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
  @keyframes pulse{50%{background:var(--accentSoft);box-shadow:0 0 0 3px var(--accentSoft)}}

  .status{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 0;color:var(--muted);font-size:15px}
  .dots{display:flex;gap:6px}
  .dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
  .dots i.on{background:var(--accent)}
  .msg{min-height:52px;text-align:center;color:var(--ink);font-size:15px;margin-top:10px;padding:0 8px}
  .msg.soft{color:var(--muted)}

  /* option lists: plain rows */
  .list{display:flex;flex-direction:column;gap:8px;margin-top:18px}
  .opt{display:flex;align-items:center;gap:12px;text-align:right;min-height:52px;padding:8px 14px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-size:16px}
  .opt:active{transform:scale(.985)}
  .opt .n{color:var(--faint);font-weight:700;font-size:14px;min-width:16px}
  .opt.ok{border-color:var(--ok);background:var(--okSoft)}
  .opt.bad{border-color:var(--bad);background:var(--badSoft)}
  .opt.dim{opacity:.45}
  .opt:disabled{cursor:default}
  .opt .r{margin-inline-start:auto;font-size:13px;color:var(--muted)}
  .opt.q-opt{display:block;padding:0;border-width:1.5px}
  .opt.q-opt .q{box-shadow:none;background:transparent}

  .fb{margin-top:14px;font-size:16px;text-align:center}
  .fb b{display:block}
  .fb.ok b{color:var(--ok)} .fb.bad b{color:var(--bad)}
  .why{color:var(--muted);font-size:15px;margin-top:4px}
  .why-btn{color:var(--accent);font-weight:600;font-size:15px;min-height:40px;padding:0 10px}

  .work{background:var(--card);border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .rule{font-size:16px;margin-top:2px}
  .rule b{font-weight:700}
  table.try{width:100%;border-collapse:collapse;font-size:15px}
  table.try th,table.try td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
  table.try tr:last-child td{border-bottom:0}
  table.try th{color:var(--muted);font-weight:500;font-size:13px}
  .win1,.win2,.eq{font-weight:700}
  .sent{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
  .sent:last-child{border-bottom:0}
  .mk{font-weight:700;flex:none;width:18px;text-align:center}
  .mk.y{color:var(--ok)} .mk.n{color:var(--bad)}

  /* review */
  .rows{background:var(--card);border-radius:16px;margin-top:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .row{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:16px}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--muted);min-width:64px;font-size:15px}
  .row .miss{color:var(--bad);text-decoration:line-through}
  .stars{text-align:center;font-size:26px;letter-spacing:6px;margin-top:18px;color:#d6d9de}
  .stars b{color:#eab308;font-weight:400}
  .stars small{display:block;letter-spacing:0;font-size:14px;color:var(--muted)}

  /* family intro */
  .fnum{font-size:15px;color:var(--muted)}
  .fname{font-size:28px;font-weight:700;margin:2px 0 6px}
  .fprint{font-size:17px;margin-bottom:22px}
  .pager{display:flex;justify-content:center;gap:6px;margin-bottom:16px}
  .pager i{width:7px;height:7px;border-radius:50%;background:var(--line)}
  .pager i.on{background:var(--ink)}

  .timer{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:16px}
  .timer i{display:block;height:100%;width:100%;background:var(--accent)}
  .hidden-q{background:var(--card);border-radius:18px;padding:34px 18px;text-align:center;color:var(--muted);box-shadow:0 1px 3px rgba(0,0,0,.05)}

  /* home */
  .homehead{display:flex;align-items:center;gap:10px;min-height:48px;margin-bottom:22px}
  .homehead .lv{font-size:14px;color:var(--muted);flex:1}
  .icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
  .icon-btn:active{background:#eeeeea}
  .next-card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:26px}
  .next-card small{color:var(--muted);font-size:14px}
  .next-card h2{margin:2px 0 14px}
  .plist{display:flex;flex-direction:column}
  .prow{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 2px;border-bottom:1px solid var(--line);text-align:right;width:100%}
  .prow:last-child{border-bottom:0}
  .prow .t{font-weight:600;font-size:17px}
  .prow .s{font-size:14px;color:var(--muted)}
  .prow .chev{margin-inline-start:auto;color:var(--faint);font-size:20px}
  .seclabel{font-size:14px;color:var(--muted);margin:0 2px 2px}
  .mini{height:4px;width:70px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
  .mini i{display:block;height:100%;background:var(--accent)}

  /* summary */
  .sum{background:var(--card);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .srow{display:block;width:100%;text-align:right;padding:13px 16px;border-bottom:1px solid var(--line)}
  .srow:last-child{border-bottom:0}
  .srow .t{font-weight:600;display:flex;align-items:center;gap:8px}
  .srow .t .acc{margin-inline-start:auto;font-size:13px;color:var(--muted);font-weight:500}
  .srow .p{font-size:15px;color:var(--muted)}
  .srow .mth{font-size:15px;margin-top:6px}
  .srow .chev{color:var(--faint);font-size:14px}
  .goldline{font-size:15px;color:var(--muted);text-align:center;margin-top:14px}
  .empty{text-align:center;color:var(--muted);padding:50px 16px}

  .m{direction:ltr;unicode-bidi:isolate}
  body.ar .m{direction:rtl}
  .neg{direction:ltr;unicode-bidi:isolate}
  .m{display:inline-block;font-weight:700;white-space:nowrap}
  sup{font-size:.65em}

  .scrim{position:fixed;inset:0;background:rgba(20,24,36,.3);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .2s}
  .sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 18px);animation:up .25s ease}
  .sheet h3{margin:0 0 4px}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
  .seg button{min-height:64px;border-radius:14px;border:1.5px solid var(--line);font-weight:700;line-height:1.4}
  .seg button small{display:block;font-weight:500;color:var(--muted);font-size:13px}
  .seg button.on{border-color:var(--accent);background:var(--accentSoft)}
  @keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(40px);opacity:.4}}
  .pop{animation:fade .25s}
  /* question parts */
  .q .qtext{font-size:18px;line-height:2;text-align:right;margin-bottom:6px}
  .q .qtext u{text-decoration-color:var(--accent);text-underline-offset:5px;text-decoration-thickness:2px}
  .q .passage{font-size:15px;line-height:1.95;text-align:right;color:var(--ink);background:#f7f7f5;border-radius:12px;padding:12px 14px;margin-bottom:14px;max-height:210px;overflow:auto;-webkit-user-select:text;user-select:text}
  .q .fig{display:flex;flex-direction:column;align-items:center;margin:10px 0 4px}
  .q.small .fig{transform:scale(.85);margin:0}
  .q .ab{display:flex;flex-direction:column;gap:8px;text-align:right;font-size:16px}
  .q .ab div{background:#f7f7f5;border-radius:12px;padding:8px 12px}
  .q .ab small{display:block;color:var(--muted);font-size:13px}
  .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;font-size:.8em;margin:0 2px}
  .fr span:last-child{border-top:1.5px solid currentColor;padding-top:1px}
  .dtable{border-collapse:collapse;font-size:14px;margin:0 auto}
  .dtable th,.dtable td{border:1px solid var(--line);padding:6px 9px;text-align:center}
  .dtable tr:first-child th{background:#f4f4f1;font-weight:600}
  .dtable th{font-weight:600}
  .bars{display:flex;align-items:flex-end;gap:12px;height:120px;padding-top:14px;border-bottom:1px solid var(--line)}
  .bar{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted)}
  .bar i{display:block;width:20px;background:var(--accent);border-radius:4px 4px 0 0}
  .bar .bl{position:relative;top:18px}
  .figcap{font-size:12px;color:var(--faint);margin-top:22px}
  .legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:4px}
  .legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-inline-end:4px;vertical-align:middle}
  .legend + .figcap{margin-top:4px}
  .quote{background:#f7f7f5;border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.9;text-align:right;margin-bottom:6px}
  .steps-math{font-size:18px;line-height:2.2;text-align:center}
  /* flash cards */
  .fc{background:var(--card);border-radius:22px;box-shadow:0 2px 12px rgba(0,0,0,.06);min-height:min(56vh,440px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 22px;animation:cardIn .3s ease;cursor:pointer}
  .fc.back{animation:flip .3s ease}
  .fc .lab{font-size:14px;color:var(--muted);margin-bottom:12px}
  .fc .big{font-size:30px;font-weight:700;line-height:1.45}
  .fc .mid{font-size:20px;font-weight:600;line-height:1.75}
  .fc .sm{font-size:15px;color:var(--muted);margin-top:14px}
  .fc .q{box-shadow:none;padding:0;background:transparent;width:100%}
  .fc table.try{font-size:16px}
  .tap-hint{font-size:13px;color:var(--faint);margin-top:22px}
  .fc .qref{width:100%;margin-bottom:18px}
  .fc .qref .q{background:#f4f4f1;padding:12px 14px;border-radius:14px}
  .qlab{font-size:13px;color:var(--faint);margin-bottom:6px}
  .fc .chosen{font-size:22px;font-weight:700;color:var(--bad);margin-bottom:6px}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.98)}}
  @keyframes flip{from{opacity:0;transform:rotateY(70deg)}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- iPhone pinch block ---------- */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});

/* ---------- saved state (this phone only) ---------- */
const KEY='qudurat-quiz-v3';
let S={learned:{},best:{},digits:'ar',resume:{}};
try{
  const raw=localStorage.getItem(KEY);
  if(raw) S=Object.assign(S,JSON.parse(raw));
  else for(const k of ['qudurat-detective-v2','qudurat-patterns-v1']){const o=JSON.parse(localStorage.getItem(k)||'null'); if(o&&o.digits){S.digits=o.digits;break;}}
}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- math digits: written in Western form, shown per setting ---------- */
const AR='٠١٢٣٤٥٦٧٨٩';
function conv(t){return t.replace(/(\d)\.(\d)/g,'$1٫$2').replace(/[0-9]/g,d=>AR[d]).replace(/x/g,'س').replace(/y/g,'ص').replace(/%/g,'٪').replace(/a/g,'أ').replace(/b/g,'ب').replace(/m/g,'م').replace(/n/g,'ن');}
function M(html){
  if(S.digits!=='ar') return html;
  return html.replace(/(<[^>]*>)|([^<]+)/g,(a,tag,txt)=>tag?tag:
    conv(txt.replace(/-(\d+)/g,'\u0001$1\u0002')).replace(/\u0001([^\u0002]*)\u0002/g,'<span class="neg">$1-</span>'));
}
const m=s=>`<span class="m">${s}</span>`;
const nAr=n=>String(n).replace(/[0-9]/g,d=>AR[d]);
const L=['أ','ب','ج','د'];
const CMP=['القيمة الأولى أكبر','القيمة الثانية أكبر','القيمتان متساويتان','المعطيات غير كافية'];

/* ---------- content: 1 question per question type (from the uploaded question set) ---------- */
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const sent=(ok,html)=>`<div class="sent"><span class="mk ${ok?'y':'n'}">${ok?'✓':'✗'}</span><span>${html}</span></div>`;
const table=(head,rows)=>`<table class="dtable"><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>i?`<td>${c}</td>`:`<th>${c}</th>`).join('')}</tr>`).join('')}</table>`;
const PASSAGE='تسعى الدول دائمًا إلى اجتذاب رؤوس الأموال والمستثمرين، وتوفر لهم مجالات المنافسة، وتعفيهم من بعض الضرائب، وتوفر لهم البنية التحتية والموارد والتسهيلات اللازمة التي تعمل على جذب المستثمرين. وينقسم الاستثمار إلى قسمين: الاستثمار المباشر، ويعمل على وجود رؤوس الأموال ويديره المستثمر من داخل الدولة، وتستطيع الدولة التحكم فيه. أما النوع الآخر فهو الاستثمار غير المباشر، ويعمل على جلب رؤوس الأموال. وتستخدم المملكة النوع الأول لأنها تملك رؤوس الأموال، ولأنه أفضل لها.';
const TRI=`<svg class="fig-svg" viewBox="0 0 220 175" width="200" aria-label="مثلث أ ب ج">
  <polygon points="110,18 195,155 25,155" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="110" y="12" text-anchor="middle" font-size="15" fill="#1f2328">أ</text>
  <text x="205" y="166" text-anchor="middle" font-size="15" fill="#1f2328">ب</text>
  <text x="14" y="166" text-anchor="middle" font-size="15" fill="#1f2328">ج</text>
  <text x="110" y="48" text-anchor="middle" font-size="13" fill="#6b7280">60°</text>
  <text x="172" y="82" text-anchor="middle" font-size="13" fill="#6b7280">9 سم</text></svg>`;
const BARS=(()=>{const v=[50,55,60,50,70,30];
  return `<div class="bars">${v.map((x,i)=>`<div class="bar"><span class="bv">${x}</span><i style="height:${x*1.3}px"></i><span class="bl">${i+1}</span></div>`).join('')}</div><div class="figcap">الإنتاج في ٦ أشهر</div>`;})();
const LINES=(()=>{const s=[['الحفظ','#2563eb',[6,5,3,2,2,2]],['الفهم','#ea580c',[5,3,4,1,6,3]],['الاستنتاج','#9ca3af',[5,2,1,3,8,2]]];
  const X=i=>30+i*38, Y=v=>130-v*12;
  const grid=[0,2,4,6,8,10].map(v=>`<line x1="26" x2="225" y1="${Y(v)}" y2="${Y(v)}" stroke="#ececec"/><text x="18" y="${Y(v)+4}" font-size="10" fill="#9aa0a8" text-anchor="end">${v}</text>`).join('');
  const lines=s.map(([,c,d])=>`<polyline fill="none" stroke="${c}" stroke-width="2.5" points="${d.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`).join('');
  const xl=[1,2,3,4,5,6].map((w,i)=>`<text x="${X(i)}" y="146" font-size="10" fill="#6b7280" text-anchor="middle">${w}</text>`).join('');
  return `<svg class="fig-svg" viewBox="0 0 235 152" width="100%" style="max-width:320px">${grid}${lines}${xl}</svg>
    <div class="legend">${s.map(([n,c])=>`<span><i style="background:${c}"></i>${n}</span>`).join('')}</div><div class="figcap">الأسابيع من ١ إلى ٦</div>`;})();

const PATTERNS=[
/* ===== لفظي ===== */
{
  id:'ana', kind:'verb', sec:'لفظي', name:'التناظر اللفظي', short:'كلمتان بينهما علاقة. ابحث عن زوج بنفس العلاقة.',
  tryQ:{stem:'اختر الزوج الذي له نفس العلاقة:', pair:'لتر : حجم', choices:['كبريت : نور','مسطرة : مهندس','زئبق : تيرمومتر','جرام : وزن'], ans:3},

     why:'عقرب الدقائق عند '+m('120°')+'. عقرب الساعات تحرك '+m('10°')+' (نصف درجة كل دقيقة). الفرق '+m('110°')+'.'},
    {text:'كانت الساعة '+m('10:10')+' ثم أصبحت '+m('10:25')+'. كم قياس الزاوية التي قطعها عقرب الدقائق؟', choices:[m('80°'),m('120°'),m('90°'),m('70°')], ans:2,
     why:'كل دقيقة = '+m('6°')+'، و'+m('15 × 6 = 90°')+'.'}
  ],
  card:{spot:'شكل مرسوم مع معطيات: أطوال متساوية، زوايا، أو توازٍ.',
        traps:'البدء بالحساب قبل ملاحظة خاصية الشكل، مثل أن المثلث متساوي الأضلاع.',
        gold:'الخصائص أولًا، ثم الحساب.'}
},
{
  id:'data', kind:'math', sec:'كمي', name:'تحليل البيانات', short:'جدول أو رسم بياني. اقرأه قبل الخيارات.',
  tryQ:{stem:'أي الآتي صحيح؟', fig:table(['النوع / العمر','دون 20 سنة','فوق 20 سنة','فوق 25 سنة'],[['الهواة','20','10','5'],['المحترفون','8','18','23']]),
        choices:['عدد المحترفين لا يزيد','عدد الهواة لا يتناقص','عدد الهواة يتناقص تدريجيًا مع العمر، والمحترفون يزيدون','عدد الهواة يتزايد تدريجيًا مع العمر، والمحترفون يتناقصون'], ans:2},
  rule:'اقرأ عنوان كل صف وعمود، ثم تتبّع الأرقام في اتجاه واحد: هل تزيد أم تنقص؟',
  demo:()=>`${sent(1,'الهواة: '+m('20')+' ثم '+m('10')+' ثم '+m('5')+'، تتناقص.')}${sent(1,'المحترفون: '+m('8')+' ثم '+m('18')+' ثم '+m('23')+'، تزيد.')}`,
  demoNote:'خيار واحد يصف الاتجاهين معًا بشكل صحيح.',
  practice:[
    {stem:'يُفهم من الرسم أن الإنتاج خلال الأشهر الستة:', fig:BARS, choices:['مستقر','متذبذب','ينخفض','متزايد'], ans:1,
     why:'الإنتاج يرتفع وينخفض بلا اتجاه ثابت، أي متذبذب.'},
    {stem:'أي طرق التعليم كانت الأفضل في الأسبوع الأول؟', fig:LINES, choices:['الاستنتاج والفهم','الفهم','الاستنتاج','الحفظ'], ans:3,
     why:'في الأسبوع الأول: الحفظ '+m('6')+'، والفهم والاستنتاج '+m('5')+' فقط.'},
    {stem:'قارن حسب الجدول (عدد الأوراق من كل فئة):', fig:table(['الفئة','الرجل الأول','الرجل الثاني'],[['20','—','5'],['50','8','10'],['100','6','4'],['500','4','4']]),
     long:true, a:'راتب الرجل الأول', b:'راتب الرجل الثاني', choices:CMP, ans:2,
     why:'الأول: '+m('400 + 600 + 2000 = 3000')+'. الثاني: '+m('100 + 500 + 400 + 2000 = 3000')+'.'}
  ],
  card:{spot:'جدول أو رسم بياني، والسؤال عن اتجاه أو مقارنة أو قيمة.',
        traps:'خيار يصف اتجاهًا صحيحًا وآخر معكوسًا، مثل الخيار (د).',
        gold:'اقرأ البيانات أولًا، ولا تخمّن من شكل الخيارات.'}
}];

const PAT=Object.fromEntries(PATTERNS.map(p=>[p.id,p]));

/* ---------- shared ---------- */
const app=document.getElementById('app');
let view={name:'home'};
function go(v){view=v;render();window.scrollTo(0,0);}
const fx=(p,html)=>p.kind==='math'?M(html):html;
document.addEventListener('click',e=>{const b=e.target.closest('[data-why]'); if(b){b.nextElementSibling.hidden=false;b.remove();}});
const why=html=>`<button class="why-btn" data-why>لماذا؟</button><div class="why" hidden>${html}</div>`;
const gear=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.2" fill="#f7f7f5"/><circle cx="15" cy="17" r="2.2" fill="#f7f7f5"/></svg>`;
const topbar=(frac,label)=>`<div class="top"><button class="x" id="x" aria-label="خروج">✕</button>
  <div class="prog"><i style="width:${frac*100}%"></i></div><div class="pnum">${label}</div></div>`;

function qView(p,q,small){
  let h='';
  if(q.passage&&!small) h+=`<div class="passage">${q.passage}</div>`;
  if(q.stem) h+=`<div class="stem">${q.stem}</div>`;
  if(q.text) h+=`<div class="qtext">${q.text}</div>`;
  if(q.fig) h+=`<div class="fig">${q.fig}</div>`;
  if(q.pair) h+=`<div class="pair">${q.pair}</div>`;
  else if(q.a) h+=q.long?`<div class="ab"><div><small>القيمة الأولى</small>${q.a}</div><div><small>القيمة الثانية</small>${q.b}</div></div>`
                        :`<div class="vs">${q.a}<span class="or">مقابل</span>${q.b}</div>`;
  return fx(p,`<div class="q ${small?'small':''}">${h}</div>`);
}
const qRef=(p,label='السؤال الذي جرّبته')=>`<div class="qref"><div class="qlab">${label}</div>${qView(p,p.tryQ,true)}</div>`;
function choicesHTML(p,q){return `<div class="list">${q.choices.map((x,i)=>`<button class="opt" data-c="${i}"><span class="n">${L[i]}</span><span>${fx(p,x)}</span></button>`).join('')}</div>`;}
function wireChoices(q,cb){
  const bs=[...app.querySelectorAll('.opt[data-c]')];
  bs.forEach(b=>b.onclick=()=>{
    const k=+b.dataset.c, ok=k===q.ans;
    bs.forEach((x,i)=>{x.disabled=true; if(i===q.ans)x.classList.add('ok'); else if(i===k)x.classList.add('bad'); else x.classList.add('dim');});
    cb(ok,k);
  });
}
function render(){
  document.body.classList.toggle('ar',S.digits==='ar');
  ({home,lesson})[view.name]();
}

/* ---------- home: one clear next step ---------- */
S.resume=S.resume||{};
if(S.rv!==4){S.resume={};S.rv=4;save();}
function seqOf(p){
  return [{t:'try'},{t:'pattern'},{t:'method'},{t:'trap'},...p.practice.map((_,i)=>({t:'prac',i})),{t:'done'}];
}
function openPattern(pid){
  const r=S.resume[pid];
  go(r&&r.k>0?Object.assign({},r,{name:'lesson'}):{name:'lesson',pid,k:0,right:0});
}
function home(){
  const nextP=PATTERNS.find(p=>!S.learned[p.id]);
  const pct=p=>Math.round(S.resume[p.id].k/seqOf(p).length*100);
  let card=null;
  if(nextP){
    const res=S.resume[nextP.id];
    card=res&&res.k>0?{small:`أكملت ${nAr(pct(nextP))}٪`,title:nextP.name,btn:'تابع'}:{small:'خطوتك التالية',title:nextP.name,btn:'ابدأ'};
  }
  const status=p=>{ if(S.learned[p.id]) return `مكتمل، أفضل نتيجة ${nAr(S.best[p.id]||0)} من ${nAr(p.practice.length)}`;
    const r=S.resume[p.id]; return r&&r.k>0?`أكملت ${nAr(pct(p))}٪`:'لم يبدأ'; };
  app.innerHTML=`
    <div class="homehead"><h1>أنماط القدرات</h1><span class="lv"></span>
      <button class="icon-btn" id="set" aria-label="الإعدادات">${gear}</button></div>
    ${card?`<div class="next-card"><small>${card.small}</small><h2>${card.title}</h2><button class="btn" id="go">${card.btn}</button></div>`
          :`<div class="next-card"><small>أحسنت</small><h2>أكملت كل الأنماط المتاحة</h2><div class="sub" style="margin:0">يمكنك إعادة أي نمط من القائمة.</div></div>`}
    ${['لفظي','كمي'].map(sec=>`<div class="seclabel" style="margin-top:14px">القسم ال${sec}</div>
    <div class="plist">${PATTERNS.filter(p=>p.sec===sec).map(p=>`<button class="prow" data-open="${p.id}">
      <div><div class="t">${p.name}</div><div class="s">${status(p)}</div></div><span class="chev">‹</span></button>`).join('')}</div>`).join('')}`;
  const g=document.getElementById('go'); if(g) g.onclick=()=>openPattern(nextP.id);
  app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openPattern(b.dataset.open));
  document.getElementById('set').onclick=settings;
}

function settings(){
  const sc=document.createElement('div'); sc.className='scrim';
  const draw=()=>{sc.innerHTML=`<div class="sheet">
      <h3>شكل الأرقام</h3>
      <div class="seg">
        <button data-d="ar" class="${S.digits==='ar'?'on':''}"><span class="m" style="direction:rtl">٣س + ٢</span><small>عربية (الافتراضي)</small></button>
        <button data-d="en" class="${S.digits==='en'?'on':''}"><span class="m" style="direction:ltr">3x + 2</span><small>إنجليزية</small></button>
      </div>
      <button class="btn" id="close">تم</button></div>`;
    sc.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{S.digits=b.dataset.d;save();draw();render();});
    sc.querySelector('#close').onclick=()=>sc.remove();
    sc.querySelector('.sheet').onclick=e=>e.stopPropagation();
  };
  sc.onclick=()=>sc.remove(); draw(); document.body.appendChild(sc);
}

/* ---------- lesson: 1 question, 3 cards, 3 practice questions ---------- */
const SECTION=t=>({try:'جرّب أولًا',pattern:'بطاقة ١ من ٣',method:'بطاقة ٢ من ٣',trap:'بطاقة ٣ من ٣',prac:'تدريب',done:'النتيجة'})[t];
function lesson(){
  const p=PAT[view.pid], seq=seqOf(p), sc=seq[view.k];
  S.resume[p.id]=Object.assign({},view); save();
  let html='', wire=()=>{};
  const next=()=>{view.k++; view.done=false; render(); scrollTo(0,0);};
  const back=()=>{view.k--; render(); scrollTo(0,0);};
  const btn=(label,dis)=>`<button class="btn" id="next" ${dis?'disabled':''}>${label}</button>`;
  const card=(inner,canBack)=>{
    html=`<div class="fc" id="fc">${inner}<div class="tap-hint">اضغط على البطاقة للمتابعة</div></div>
      <div class="bottom">${btn('التالي')}${canBack?'<button class="link" id="back">رجوع</button>':''}</div>`;
    wire=()=>{document.getElementById('next').onclick=next; document.getElementById('fc').onclick=next;
      const b=document.getElementById('back'); if(b) b.onclick=back;};
  };
  const quiz=(q,title,onAns)=>{
    html=`<h2>${title}</h2>${qView(p,q)}${choicesHTML(p,q)}<div id="fb"></div>
      <div class="bottom">${btn('التالي',true)}</div>`;
    wire=()=>{wireChoices(q,(ok,k)=>{document.getElementById('fb').innerHTML=onAns(ok,k); document.getElementById('next').disabled=false;});
      document.getElementById('next').onclick=next;};
  };

  if(sc.t==='try') quiz(p.tryQ,'جرّب بدون مساعدة',ok=>`<div class="fb ${ok?'ok':'bad'} pop"><b>${ok?'صحيح':'غير صحيح'}</b><div class="why">${ok?'صحيح. الآن لنعرف النمط الذي يجعلك تجيب بثقة في كل مرة.':'لا بأس. لنعرف النمط الذي يكشف الإجابة.'}</div></div>`);
  else if(sc.t==='pattern') card(`${qRef(p)}<div class="lab">هذا السؤال من نمط</div><div class="big">${p.name}</div>
      <div class="sm" style="color:var(--ink);font-size:17px">تعرفه من: ${fx(p,p.card.spot)}</div>`);
  else if(sc.t==='method') card(`<div class="lab">الطريقة</div><div class="mid" style="margin-bottom:14px">${fx(p,p.rule)}</div>
      <div style="width:100%">${fx(p,p.demo())}</div><div class="sm">${fx(p,p.demoNote)}</div>`,true);
  else if(sc.t==='trap') card(`<div class="lab">الفخ الشائع</div><div class="mid">${fx(p,p.card.traps)}</div>
      <div class="sm" style="color:var(--ink);font-size:17px;margin-top:20px"><b>القاعدة:</b> ${fx(p,p.card.gold)}</div>`,true);
  else if(sc.t==='prac'){const q=p.practice[sc.i];
    quiz(q,`سؤال مشابه (${nAr(sc.i+1)} من ${nAr(p.practice.length)})`,(ok)=>{ if(ok&&!view.done) view.right=(view.right||0)+1; view.done=true; S.resume[p.id]=Object.assign({},view); save();
      return `<div class="fb ${ok?'ok':'bad'} pop"><b>${ok?'صحيح':'غير صحيح'}</b>${why(fx(p,q.why))}</div>`;});}
  else if(sc.t==='done'){const r=view.right||0, n=p.practice.length;
    if(!view.scored){view.scored=true; S.best[p.id]=Math.max(S.best[p.id]||0,r); S.learned[p.id]=true; save();}
    html=`<div class="fc" style="cursor:default"><div class="lab">نتيجتك</div><div class="big">${nAr(r)} من ${nAr(n)}</div>
        <div class="sm">${r===n?'ممتاز، النمط واضح لك.':r>=n-1?'جيد جدًا.':'أعد الدرس لترسيخ النمط.'}</div></div>
      <div class="bottom"><button class="btn" id="home">العودة</button><button class="link" id="again">إعادة الدرس</button></div>`;
    wire=()=>{
      document.getElementById('home').onclick=()=>{delete S.resume[p.id]; save(); go({name:'home'});};
      document.getElementById('again').onclick=()=>{delete S.resume[p.id]; save(); go({name:'lesson',pid:p.id,k:0,right:0});};
    };
  }

  app.innerHTML=topbar((view.k+1)/seq.length,SECTION(sc.t))+`<div class="screen">${html}</div>`;
  document.getElementById('x').onclick=()=>go({name:'home'});
  wire();
}

render();
</script>
</body>
</html>
