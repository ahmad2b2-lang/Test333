<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#f5f6fa">
<title>محقق القدرات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light only;
    --bg:#f5f6fa; --card:#fff; --ink:#1c2233; --muted:#5d6577; --line:#e6e8ef;
    --math:#2f6fe4; --mathSoft:#e8f0fd; --verb:#8a4fd8; --verbSoft:#f1eafc;
    --ok:#1f9d55; --okSoft:#e3f5ea; --bad:#d64545; --badSoft:#fbe7e7; --warn:#b7791f; --warnSoft:#fdf3e1;
    --paper:#fffdf6; --paperLine:#efe5c8; --hl:#ffe45c;
    --accent:var(--math); --accentSoft:var(--mathSoft);
  }
  *{box-sizing:border-box}
  html,body{margin:0;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
  body{
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    background:var(--bg);color:var(--ink);min-height:100dvh;font-size:16px;line-height:1.7;
  }
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  #app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
       padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 20px)}

  .bar{display:flex;align-items:center;gap:10px;min-height:48px;margin-bottom:6px}
  .bar h1{font-size:21px;margin:0;flex:1}
  .bar .title{flex:1;font-weight:700;font-size:17px}
  .icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.05);flex:none}
  .icon-btn:active{transform:scale(.94)}
  .rank{display:flex;flex-direction:column;justify-content:center;align-items:center;background:var(--card);border-radius:14px;padding:2px 12px;min-height:44px;box-shadow:0 2px 8px rgba(0,0,0,.05);font-weight:700;font-size:13px;line-height:1.35;white-space:nowrap}
  .rank small{color:var(--warn);font-size:12px}

  .hero{background:linear-gradient(135deg,#2f6fe4,#8a4fd8);color:#fff;border-radius:22px;padding:18px;margin:6px 0 16px}
  .hero b{font-size:18px;display:block;margin-bottom:4px}
  .hero p{margin:0;opacity:.92;font-size:15px}
  .hero .meter{margin-top:12px;height:8px;background:rgba(255,255,255,.3);border-radius:8px;overflow:hidden}
  .hero .meter i{display:block;height:100%;background:#fff;border-radius:8px}
  .hero small{display:block;margin-top:6px;opacity:.9}

  h2.sec{font-size:15px;color:var(--muted);margin:14px 4px 8px;font-weight:600}
  .pblock{background:var(--card);border-radius:20px;box-shadow:0 3px 14px rgba(0,0,0,.05);margin-bottom:12px;overflow:hidden}
  .pcard{display:flex;align-items:center;gap:14px;width:100%;text-align:right;padding:14px;min-height:80px}
  .pcard:active{background:#fafbfd}
  .pcard .ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:26px;flex:none}
  .pcard .t{font-weight:700;font-size:17px}
  .pcard .d{color:var(--muted);font-size:14px;line-height:1.5}
  .pcard .st{margin-inline-start:auto;font-size:12px;font-weight:700;border-radius:10px;padding:4px 9px;flex:none}
  .st.done{background:var(--okSoft);color:var(--ok)}
  .st.todo{background:#eef0f4;color:var(--muted)}
  .meters{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 14px}
  .fm{background:#f7f8fb;border-radius:12px;padding:7px 9px;font-size:13px;line-height:1.4}
  .fm .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fm .b{height:5px;border-radius:5px;background:var(--line);margin:5px 0 3px;overflow:hidden}
  .fm .b i{display:block;height:100%;border-radius:5px}
  .fm small{color:var(--muted)}
  .mlabel{padding:0 14px 6px;font-size:13px;color:var(--muted);font-weight:600}

  .wide-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:16px;font-weight:700;font-size:16px}
  .primary{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(47,111,228,.22)}
  .primary:active{transform:scale(.98)}
  .primary:disabled{opacity:.4;box-shadow:none}
  .ghost{background:var(--card);border:1.5px solid var(--line)}
  .small-btn{min-height:44px;padding:0 14px;border-radius:12px;font-weight:700;font-size:14px;background:var(--card);border:1.5px solid var(--line)}
  .small-btn:disabled{opacity:.4}

  .steps{display:flex;gap:4px;margin:2px 0 12px}
  .steps i{flex:1;height:6px;border-radius:6px;background:var(--line)}
  .steps i.on{background:var(--accent)}
  .kicker{display:inline-block;align-self:flex-start;font-size:13px;font-weight:700;color:var(--accent);background:var(--accentSoft);border-radius:10px;padding:3px 10px;margin-bottom:8px}
  .stage{flex:1;display:flex;flex-direction:column}
  .stage h3{font-size:21px;margin:0 0 4px;line-height:1.45}
  .lead{color:var(--muted);margin:0 0 12px}
  .card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 3px 14px rgba(0,0,0,.05);margin-bottom:12px}
  .footer{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:10px}

  /* case file */
  .file{position:relative;background:var(--paper);border:1.5px solid var(--paperLine);border-radius:18px;padding:30px 14px 14px;margin-bottom:12px;box-shadow:0 3px 12px rgba(120,100,40,.07)}
  .file::before{content:attr(data-label);position:absolute;top:-1.5px;inset-inline-start:16px;background:var(--paperLine);color:#7a6420;font-size:12px;font-weight:700;padding:2px 12px;border-radius:0 0 10px 10px}
  .file.compact{padding:26px 12px 10px;margin-bottom:9px}
  .file.compact .compare .v{font-size:17px}
  .file.compact .pair{font-size:21px;padding:6px}
  .file.pick{width:100%;text-align:right;display:block;font:inherit;cursor:pointer}
  .file.pick:active{transform:scale(.985)}
  .file.right{border-color:var(--ok);background:#f4fbf6}
  .file.wrong{border-color:var(--bad);background:#fdf5f5}
  .ftag{position:absolute;top:4px;inset-inline-end:10px;font-size:12px;font-weight:700;border-radius:8px;padding:1px 8px;background:var(--accentSoft);color:var(--accent)}
  .stem{font-size:16px;margin-bottom:10px;line-height:2.1}
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .compare div{background:rgba(255,255,255,.75);border:1px solid var(--paperLine);border-radius:14px;padding:8px;text-align:center}
  .compare small{display:block;color:var(--muted);font-size:12px}
  .compare .v{font-size:20px;font-weight:700;line-height:2}
  .pair{font-size:27px;font-weight:700;text-align:center;padding:10px;background:rgba(255,255,255,.75);border:1px solid var(--paperLine);border-radius:14px;word-spacing:4px}
  .skel{font-size:18px;font-weight:700;text-align:center;color:#6b5a1d;padding:16px 6px;background:repeating-linear-gradient(45deg,#fff8de,#fff8de 10px,#fffbea 10px,#fffbea 20px);border-radius:12px;line-height:1.9}
  .tok{border-radius:6px;padding:0 3px;transition:background .2s}
  .tok.tap{border-bottom:2px dotted #c4b88f;cursor:pointer}
  .tok.hit{background:linear-gradient(transparent 30%,var(--hl) 30%,var(--hl) 92%,transparent 92%);border-bottom-color:transparent}
  .tok.missed{background:rgba(214,69,69,.13);outline:1.5px dashed var(--bad);outline-offset:1px}
  .tok.shake{animation:shake .4s}
  .tok.pulse{animation:pulse .8s 4}
  @keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
  @keyframes pulse{50%{background:var(--hl);box-shadow:0 0 0 4px rgba(255,228,92,.5)}}
  .stamp{position:absolute;top:10px;inset-inline-end:12px;border:3px solid var(--bad);color:var(--bad);font-weight:800;font-size:15px;padding:2px 10px;border-radius:8px;transform:rotate(-12deg);background:rgba(255,255,255,.7);animation:stamp .45s cubic-bezier(.3,1.6,.6,1)}
  .stamp.ok{border-color:var(--ok);color:var(--ok)}
  @keyframes stamp{from{transform:rotate(-12deg) scale(2.2);opacity:0}}

  .counter{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:10px}
  .counter b{font-size:15px}
  .dots{display:flex;gap:5px}
  .dots i{width:14px;height:14px;border-radius:50%;border:2px solid #d9cf9f;background:#fff}
  .dots i.on{background:var(--hl);border-color:#e3c320}
  .notes{background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:0 3px 14px rgba(0,0,0,.05)}
  .notes .h{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:2px}
  .note{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px;animation:pop .25s}
  .note:last-child{border-bottom:0}
  .note .w{font-weight:700;background:linear-gradient(transparent 30%,var(--hl) 30%,var(--hl) 92%,transparent 92%);padding:0 3px;flex:none;align-self:flex-start}
  .note.empty{color:var(--muted)}

  .famgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px}
  .fam{display:flex;align-items:center;gap:8px;text-align:right;min-height:58px;padding:8px 10px;border-radius:15px;background:var(--card);border:2px solid var(--line);font-weight:600;font-size:15px;line-height:1.35}
  .fam:active{transform:scale(.97)}
  .fam .i{font-size:20px;flex:none}
  .fam.ok{border-color:var(--ok);background:var(--okSoft)}
  .fam.bad{border-color:var(--bad);background:var(--badSoft)}
  .fam.dim{opacity:.5}
  .fam:disabled{cursor:default}

  .choices{display:flex;flex-direction:column;gap:9px;margin-top:10px}
  .choice{display:flex;align-items:center;gap:12px;text-align:right;min-height:54px;padding:10px 12px;border-radius:15px;background:var(--card);border:2px solid var(--line);font-size:16px}
  .choice:active{transform:scale(.985)}
  .choice .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#eef0f4;font-weight:700;flex:none}
  .choice.ok{border-color:var(--ok);background:var(--okSoft)} .choice.ok .l{background:var(--ok);color:#fff}
  .choice.bad{border-color:var(--bad);background:var(--badSoft)} .choice.bad .l{background:var(--bad);color:#fff}
  .choice.dim{opacity:.55}

  .fb{border-radius:15px;padding:12px 14px;margin-top:12px;font-size:15px;animation:pop .25s ease}
  .fb.ok{background:var(--okSoft);color:#14532d}
  .fb.bad{background:var(--badSoft);color:#7f1d1d}
  .fb.info{background:var(--warnSoft);color:#5a3608}
  .fb b{display:block;font-size:16px;margin-bottom:2px}
  @keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

  .method{background:var(--accentSoft);border-radius:15px;padding:12px 14px;margin-bottom:12px;font-size:15px}
  .method b{color:var(--accent)}
  table.try{width:100%;border-collapse:collapse;font-size:15px;margin-top:4px}
  table.try th,table.try td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
  table.try th{color:var(--muted);font-weight:600;font-size:13px}
  .win1{color:var(--math);font-weight:700}.win2{color:var(--verb);font-weight:700}.eq{color:var(--warn);font-weight:700}
  .sent{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
  .sent:last-child{border-bottom:0}
  .mk{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:700;flex:none}
  .mk.y{background:var(--okSoft);color:var(--ok)} .mk.n{background:var(--badSoft);color:var(--bad)}

  .chain{display:flex;flex-direction:column;align-items:stretch;gap:0}
  .link{background:var(--card);border-radius:15px;padding:10px 14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .link small{display:block;color:var(--muted);font-size:12px;font-weight:700}
  .arrow{text-align:center;color:var(--muted);font-size:18px;line-height:1.6}
  .cl{display:inline-block;margin:3px 0 0 6px;font-weight:700;padding:0 4px;background:linear-gradient(transparent 30%,var(--hl) 30%,var(--hl) 92%,transparent 92%)}
  .cl.miss{background:none;color:var(--bad);text-decoration:line-through dashed}
  .stars{display:flex;justify-content:center;gap:10px;margin:14px 0 4px}
  .starbox{flex:1;background:var(--card);border-radius:14px;padding:8px 4px;text-align:center;font-size:12px;color:var(--muted);box-shadow:0 2px 10px rgba(0,0,0,.05);line-height:1.4}
  .starbox b{display:block;font-size:24px;filter:grayscale(1);opacity:.35}
  .starbox.on b{filter:none;opacity:1}

  .famintro .big{font-size:42px;line-height:1}
  .famintro h4{margin:6px 0 2px;font-size:20px}
  .famintro .lbl{font-size:13px;font-weight:700;color:var(--accent);margin-top:12px}
  .famintro ul{margin:4px 0 0;padding-inline-start:20px}
  .pager{display:flex;justify-content:center;gap:6px;margin:4px 0 10px}
  .pager i{width:8px;height:8px;border-radius:50%;background:var(--line)}
  .pager i.on{background:var(--accent);width:20px;border-radius:6px}

  .flashbar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-bottom:10px}
  .flashbar i{display:block;height:100%;background:var(--accent);width:100%}
  .hidden-case{text-align:center;padding:30px 10px;color:var(--muted);background:var(--paper);border:1.5px dashed var(--paperLine);border-radius:18px;margin-bottom:12px}
  .hidden-case div{font-size:40px}

  .pc{background:var(--paper);border:1.5px solid var(--paperLine);border-radius:22px;overflow:hidden;margin-bottom:14px;position:relative}
  .pc .hd{background:var(--accent);color:#fff;padding:14px 16px}
  .pc .hd small{opacity:.85}
  .pc .hd b{display:block;font-size:20px}
  .pc .fr{padding:11px 16px;border-bottom:1px solid var(--paperLine);font-size:15px}
  .pc .fr:last-of-type{border-bottom:0}
  .pc .fr b{font-size:16px}
  .pc .fr div{color:var(--muted);font-size:14px}
  .pc .fr span.k{color:var(--accent);font-weight:700}
  .pc .gold{margin:4px 16px 14px;background:var(--warnSoft);border-radius:12px;padding:10px 12px;font-weight:700;color:#5a3608;font-size:15px}
  .pc .stamp{top:62px}

  .empty{text-align:center;color:var(--muted);padding:40px 16px}
  .empty div{font-size:46px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 64px);background:#1c2233;color:#fff;border-radius:14px;padding:10px 16px;font-size:15px;max-width:min(92vw,480px);z-index:20;animation:pop .2s;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .toast.ok{background:var(--ok)}

  .m{direction:ltr;unicode-bidi:isolate}
  body.ar .m{direction:rtl}
  .neg{direction:ltr;unicode-bidi:isolate}
  .m{display:inline-block;font-weight:700;white-space:nowrap}
  sup{font-size:.65em}

  .scrim{position:fixed;inset:0;background:rgba(20,24,36,.35);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .2s}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);animation:up .25s ease}
  .sheet h3{margin:0 0 4px}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
  .seg button{min-height:64px;border-radius:15px;border:2px solid var(--line);font-weight:700;line-height:1.4}
  .seg button small{display:block;font-weight:500;color:var(--muted);font-size:13px}
  .seg button.on{border-color:var(--math);background:var(--mathSoft)}
  @keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(40px);opacity:.4}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- iPhone pinch block ---------- */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});

/* ---------- saved state (this phone only) ---------- */
const KEY='qudurat-detective-v2';
let S={learned:{},stars:0,fam:{},digits:'ar'};
try{
  const raw=localStorage.getItem(KEY);
  if(raw) S=Object.assign(S,JSON.parse(raw));
  else{const old=JSON.parse(localStorage.getItem('qudurat-patterns-v1')||'null'); if(old&&old.digits) S.digits=old.digits;}
}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- math digits ---------- */
const AR='٠١٢٣٤٥٦٧٨٩';
function conv(t){return t.replace(/(\d)\.(\d)/g,'$1٫$2').replace(/[0-9]/g,d=>AR[d]).replace(/x/g,'س').replace(/y/g,'ص').replace(/%/g,'٪').replace(/a/g,'أ').replace(/b/g,'ب');}
function M(html){
  if(S.digits!=='ar') return html;
  return html.replace(/(<[^>]*>)|([^<]+)/g,(a,tag,txt)=>tag?tag:
    conv(txt.replace(/-(\d+)/g,'\u0001$1\u0002')).replace(/\u0001([^\u0002]*)\u0002/g,'<span class="neg">$1-</span>'));
}
const m=s=>`<span class="m">${s}</span>`;
const num=n=>S.digits==='ar'?String(n).replace(/[0-9]/g,d=>AR[d]):String(n);
const nAr=n=>String(n).replace(/[0-9]/g,d=>AR[d]); // UI counters always Arabic
const L=['أ','ب','ج','د'];
const CMP=['القيمة الأولى أكبر','القيمة الثانية أكبر','القيمتان متساويتان','المعطيات غير كافية'];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.random()*a.length|0];

/* ---------- patterns and their families ---------- */
const PAT={
  cmp:{id:'cmp',kind:'math',icon:'⚖️',name:'المقارنات الكمية',short:'من الأكبر؟ القيمة الأولى أم الثانية؟',fams:['var','nums','swap','neg'],big:'v1',
       gold:'البصمة ← الفصيلة ← الطريقة ← الجواب. لا تبدأ الحساب قبل أن تعرف الفصيلة.'},
  ana:{id:'ana',kind:'verb',icon:'🔗',name:'التناظر اللفظي',short:'كلمتان بينهما علاقة. ما نوعها؟',fams:['part','place','cause','stage','tool','opp'],big:'st1',
       gold:'سمِّ العلاقة بجملة قبل أن تنظر إلى الخيارات.'}
};
const FAM={
  var:{p:'cmp',icon:'🎭',name:'المتغيّر المراوغ',print:['يوجد حرف مثل '+m('x')+' أو '+m('y'),'قيمته غير محددة (أو لها شرط فقط)'],
       method:'جرّب قيمًا مختلفة: '+m('0')+'، '+m('1')+'، '+m('-1')+'، '+m('½')+'، '+m('10')+'. إذا تغيّر الفائز ← (د).',skel:'قارن: [عبارة فيها حرف] مع [عبارة أخرى]'},
  nums:{p:'cmp',icon:'🔢',name:'أعداد صريحة',print:['لا يوجد أي حرف','أرقام وعمليات فقط'],
       method:'احسب أو قرّب بسرعة. الجواب <b>لا يمكن</b> أن يكون (د).',skel:'قارن: [أرقام وعمليات] مع [رقم]'},
  swap:{p:'cmp',icon:'🔄',name:'النسب المتبادلة',print:['«٪ من» في الطرفين','نفس العددين تبادلا المكان'],
       method:m('a%')+' من '+m('b')+' = '+m('b%')+' من '+m('a')+' دائمًا ← متساويتان (ج) بدون حساب.',skel:'قارن: [■٪ من ▲] مع [▲٪ من ■]'},
  neg:{p:'cmp',icon:'➖',name:'قوى السالب',print:['عدد سالب داخل قوس','وعليه أس (قوة)'],
       method:'الأس الزوجي يجعله موجبًا، والأس الفردي يبقيه سالبًا. والموجب أكبر.',skel:'قارن: [(سالب) أس زوجي] مع [(سالب) أس فردي]'},
  part:{p:'ana',icon:'🧩',name:'جزء وكل',print:['الأول قطعة من الثاني','جملته: «الأول جزء من الثاني»'],

function toks(c){
  if(c._t) return c._t;
  const out=[]; const add=(t,pl)=>out.push({t:t[0],k:t[1],n:t[2],pl});
  c.stem.forEach(t=>add(t,'stem'));
  if(c.a){add(c.a,'a');add(c.b,'b');} else c.pair.forEach(t=>add(t,'pair'));
  return c._t=out;
}
const clueIdx=c=>toks(c).map((t,i)=>t.k==='c'?i:-1).filter(i=>i>=0);

/* case file card */
function caseCard(c,o={}){
  const p=patOf(c), T=toks(c);
  let inner;
  if(o.skel) inner=`<div class="skel">${FAM[c.f].skel}</div>`;
  else{
    const tk=i=>{const t=T[i]; let cls='tok';
      if(o.tap) cls+=' tap';
      if(o.found&&o.found.includes(i)) cls+=' hit';
      else if(o.reveal&&t.k==='c') cls+=o.reveal==='missed'?' missed':' hit';
      return `<span class="${cls}" data-t="${i}">${t.t}</span>`;};
    const idx=pl=>T.map((t,i)=>t.pl===pl?i:-1).filter(i=>i>=0);
    inner=`<div class="stem">${idx('stem').map(i=>(/^[،,]/.test(T[i].t)?'':' ')+tk(i)).join('').trim()}</div>`;
    if(c.a) inner+=`<div class="compare"><div><small>القيمة الأولى</small><span class="v">${tk(idx('a')[0])}</span></div><div><small>القيمة الثانية</small><span class="v">${tk(idx('b')[0])}</span></div></div>`;
    else inner+=`<div class="pair">${idx('pair').map(tk).join(' ')}</div>`;
  }
  const tag=o.tag?`<span class="ftag">${o.tag}</span>`:'';
  const el=o.button?'button':'div';
  const html=`<${el} class="file ${o.compact?'compact':''} ${o.button?'pick':''} ${o.cls||''}" data-label="${o.label||'ملف القضية'}" ${o.button?`data-pick="${o.button}"`:''}>${tag}${o.stamp||''}${inner}</${el}>`;
  return fx(p,html);
}

}
function wireFam(root,right,cb){
  const t0=performance.now();
  const btns=[...root.querySelectorAll('.fam')];
  btns.forEach(b=>b.onclick=()=>{

    cb(ok,f,performance.now()-t0);
  });
}
function famFeedback(p,ok,picked,right,extra=''){

}

    html=`<span class="kicker">القضية الكبرى · ١ جمع الأدلة</span><h3>اقرأ كمحقق</h3>
      <p class="lead">اضغط على الكلمات التي تعتقد أنها أدلة. احذر: بعض الكلمات تبدو مهمة وليست كذلك.</p>
      <div class="counter"><b>وجدت ${nAr(found.length)} من ${nAr(cl.length)} أدلة</b>
        <div class="dots">${cl.map((_,i)=>`<i class="${i<found.length?'on':''}"></i>`).join('')}</div></div>
      ${caseCard(c,{tap:true,found,label:'ملف القضية رقم ٠٠١'})}
      <div class="notes"><div class="h">📝 ملاحظات المحقق</div>
        ${found.length?found.map(i=>{const t=toks(c)[i];return `<div class="note"><span class="w">${fx(p,t.t)}</span><span>${fx(p,t.n)}</span></div>`;}).join(''):'<div class="note empty">لم تجد أدلة بعد.</div>'}</div>
      <div class="footer">
        <button class="small-btn" id="hint" ${view.hint||found.length===cl.length?'disabled':''} style="align-self:center">🔍 عدسة المساعدة (${view.hint?'استُخدمت':'مرة واحدة'})</button>
        ${nextBtn(found.length===cl.length?'وجدت كل الأدلة! سمِّ الفصيلة':`تابع إلى تسمية الفصيلة (${nAr(found.length)}/${nAr(cl.length)})`,found.length===0)}</div>`;
    wire=()=>{
      app.querySelectorAll('.tok.tap').forEach(el=>el.onclick=()=>{
        const i=+el.dataset.t, t=toks(c)[i];
        if(t.k==='c'){ if(!found.includes(i)){found.push(i); render();} }
        else{ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
          toast(t.k==='d'?`ليس دليلًا: ${t.n}`:'ليس دليلًا. ابحث عن كلمة تكشف نوع السؤال.'); }
      });
      document.getElementById('hint').onclick=()=>{
        view.hint=true; const miss=cl.find(i=>!found.includes(i)); render();
        const el=app.querySelector(`[data-t="${miss}"]`); if(el){el.classList.add('pulse');}
        toast('🔍 انظر إلى الكلمة المضيئة');
      };
      document.getElementById('next').onclick=()=>{view.step=2;view.nameOk=null;render();scrollTo(0,0);};
    };
  }
  else if(st===2){
    html=`<span class="kicker">القضية الكبرى · ٢ سمِّ الفصيلة</span><h3>من أي فصيلة هذه القضية؟</h3>
      <p class="lead">هذه أهم خطوة: استخدم أدلتك. لا تحلّ السؤال بعد.</p>
      ${caseCard(c,{found:view.found,label:'ملف القضية رقم ٠٠١'})}
      ${famButtons(p)}<div id="fb"></div>
      <div class="footer">${nextBtn('دع النمط يعمل',true)}</div>`;
    wire=()=>{
      wireFam(app,c.f,(ok,f,ms)=>{view.nameOk=ok;view.nameMs=ms;rec(c.f,ok,ms);
        document.getElementById('fb').innerHTML=famFeedback(p,ok,f,c.f); enableNext();});
      document.getElementById('next').onclick=()=>{view.step=3;view.picked=null;render();scrollTo(0,0);};
    };
  }
  else if(st===3){
    const F=FAM[c.f];
    html=`<span class="kicker">القضية الكبرى · ٣ النمط يعمل</span><h3>طريقة «${F.name}»</h3>
      <div class="method"><b>${F.icon} الطريقة:</b> ${fx(p,F.method)}</div>
      ${caseCard(c,{found:view.found,compact:true,label:'ملف القضية رقم ٠٠١'})}
      <div class="card">${fx(p,c.work())}<div id="after"></div></div>
      <div style="font-weight:700">الخطوة الأخيرة لك: ما الحكم؟</div>
      <div class="choices">${c.choices.map((x,i)=>`<button class="choice" data-c="${i}"><span class="l">${L[i]}</span><span>${x}</span></button>`).join('')}</div>
      <div id="fb"></div>
      <div class="footer">${nextBtn('أعلن الحكم',true)}</div>`;
    wire=()=>{
      const btns=[...app.querySelectorAll('.choice')];
      btns.forEach(b=>b.onclick=()=>{
        const k=+b.dataset.c, ok=k===c.ans; view.ansOk=ok;
        btns.forEach((x,i)=>{x.disabled=true; if(i===c.ans)x.classList.add('ok'); else if(i===k)x.classList.add('bad'); else x.classList.add('dim');});
        if(c.after) document.getElementById('after').innerHTML='<div style="margin-top:8px">'+c.after()+'</div>';
        document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'حكم صحيح ✓':'ليس هذا ✗'}</b>${fx(p,c.why[k])}</div>`;
        enableNext();
      });
      document.getElementById('next').onclick=()=>{view.step=4;render();scrollTo(0,0);};
    };
  }
  else if(st===4){
    const cl=clueIdx(c), allFound=cl.every(i=>view.found.includes(i)), fast=view.nameOk&&view.nameMs<20000;
    const got=[allFound,!!view.nameOk,fast];
    if(!view.scored){view.scored=true; addStars(got.filter(Boolean).length);}
    const T=toks(c);
    html=`<span class="kicker">القضية الكبرى · ٤ الحكم</span><h3>كيف قادتك الأدلة إلى الحل</h3>
      ${caseCard(c,{found:view.found,reveal:'missed',label:'ملف القضية رقم ٠٠١',stamp:'<span class="stamp ok">تم حل القضية</span>'})}
      <div class="chain">
        <div class="link"><small>🔎 الأدلة</small>${cl.map(i=>`<span class="cl ${view.found.includes(i)?'':'miss'}">${fx(p,T[i].t)}</span>`).join('')}
          ${allFound?'':'<div style="font-size:13px;color:var(--bad)">المشطوب = دليل فاتك (مظلّل بالأحمر في الملف)</div>'}</div>
        <div class="arrow">⬇</div>
        <div class="link"><small>🧬 الفصيلة</small><b>${FAM[c.f].icon} ${FAM[c.f].name}</b></div>
        <div class="arrow">⬇</div>
        <div class="link"><small>🛠️ الطريقة</small>${fx(p,FAM[c.f].method)}</div>
        <div class="arrow">⬇</div>
        <div class="link"><small>⚖️ الجواب</small><b>${c.answerLabel}</b></div>
      </div>
      <div class="stars">
        <div class="starbox ${got[0]?'on':''}"><b>⭐</b>كل الأدلة</div>
        <div class="starbox ${got[1]?'on':''}"><b>⭐</b>الفصيلة من أول مرة</div>
        <div class="starbox ${got[2]?'on':''}"><b>⭐</b>تسمية سريعة</div></div>
      <div class="footer">${nextBtn('إلى تدريبات ذكاء الأنماط')}</div>`;
    wire=()=>{document.getElementById('next').onclick=()=>{Object.assign(view,{step:5,r:0,d:null});render();scrollTo(0,0);};};
  }
  else if(st>=5&&st<=7){
    const r=view.r, total=ROUNDS[st];
    const advance=()=>{ if(r<total-1){view.r++;view.d=null;} else {view.step++;view.r=0;view.d=null;} render();scrollTo(0,0); };
    const kick=`<span class="kicker">تدريب ${['','','','','','التنكّر','الدخيل','الومضة'][st]} · جولة ${nAr(r+1)} من ${nAr(total)}</span>`;

    if(st===5){
      if(!view.d){const ok=p.fams.filter(f=>casesOf(f).length>=3); const f=pick(ok.filter(x=>x!==view.lastF).length?ok.filter(x=>x!==view.lastF):ok); view.lastF=f;
        view.d={f,cs:shuffle(casesOf(f)).slice(0,3).map(x=>x.id),done:false,skel:false};}
      const d=view.d;
      html=`${kick}<h3>نفس المجرم بثلاثة أقنعة</h3>
        <p class="lead">هذه القضايا تبدو مختلفة، لكنها من فصيلة واحدة. ما هي؟</p>
        ${d.cs.map((id,i)=>caseCard(CASE[id],{compact:true,label:'قضية '+nAr(i+1),reveal:d.done?'hit':null,skel:d.skel})).join('')}
        ${d.done?`<button class="small-btn" id="skel" style="align-self:center;margin-bottom:6px">🦴 ${d.skel?'أظهر القضايا':'اكشف الهيكل المشترك'}</button>`:''}
        ${d.done?'':famButtons(p)}<div id="fb">${d.fbHTML||''}</div>
        <div class="footer">${nextBtn(r<total-1?'الجولة التالية':'إلى تدريب الدخيل',!d.done)}</div>`;
      wire=()=>{
        if(!d.done) wireFam(app,d.f,(ok,f,ms)=>{rec(d.f,ok,ms); if(ok)addStars(1);
          d.fbHTML=famFeedback(p,ok,f,d.f,' اضغط «اكشف الهيكل» لترى أن الثلاثة نفس السؤال تمامًا.'); d.done=true; render();});
        const sk=document.getElementById('skel'); if(sk) sk.onclick=()=>{d.skel=!d.skel;render();};
        document.getElementById('next').onclick=advance;
      };
    }
    else if(st===6){
      if(!view.d){const A=pick(p.fams), B=pick(p.fams.filter(f=>f!==A));
        const cs=shuffle([...shuffle(casesOf(A)).slice(0,2).map(x=>x.id),pick(casesOf(B)).id]);
        view.d={A,B,cs,odd:cs.findIndex(id=>CASE[id].f===B),pick:null};}
      const d=view.d;
      html=`${kick}<h3>من الدخيل؟</h3>
        <p class="lead">قضيتان من نفس الفصيلة، وواحدة من فصيلة مختلفة. اضغط على الدخيلة.</p>
        ${d.cs.map((id,i)=>caseCard(CASE[id],{compact:true,label:'قضية '+nAr(i+1),button:d.pick===null?String(i):'',
          tag:d.pick!==null?FAM[CASE[id].f].icon+' '+FAM[CASE[id].f].name:'',reveal:d.pick!==null?'hit':null,
          cls:d.pick!==null&&i===d.odd?'right':d.pick===i&&i!==d.odd?'wrong':''})).join('')}
        <div id="fb">${d.pick!==null?`<div class="fb ${d.pick===d.odd?'ok':'bad'}"><b>${d.pick===d.odd?'أمسكت بالدخيل ✓':'ليست هذه ✗'}</b>
          قضيتان من «${FAM[d.A].name}» (${fx(p,FAM[d.A].print[0])})، والدخيلة من «${FAM[d.B].name}» (${fx(p,FAM[d.B].print[0])}).</div>`:''}</div>
        <div class="footer">${nextBtn(r<total-1?'الجولة التالية':'إلى تدريب الومضة',d.pick===null)}</div>`;
      wire=()=>{
        app.querySelectorAll('[data-pick]').forEach(b=>{ if(b.dataset.pick==='')return; b.onclick=()=>{d.pick=+b.dataset.pick; if(d.pick===d.odd)addStars(1); render();};});
        document.getElementById('next').onclick=advance;
      };
    }
    else{
      if(!view.d){view.d={id:pick(CASES.filter(x=>FAM[x.f].p===p.id&&x.id!==view.lastFlash)).id,phase:'show'}; view.lastFlash=view.d.id;}
      const d=view.d, cc=CASE[d.id], T=FLASH_T[r];
      if(d.phase==='show'){
        html=`${kick}<h3>ومضة: ${nAr(T)} ثوانٍ فقط</h3>
          <p class="lead">لا تحلّ. فقط التقط البصمة قبل أن تختفي القضية.</p>
          <div class="flashbar"><i id="fbar"></i></div>
          ${caseCard(cc,{label:'قضية سريعة'})}
          <div class="footer"><button class="wide-btn ghost" id="ready">عرفتها، أخفِها الآن</button></div>`;
        wire=()=>{
          const bar=document.getElementById('fbar'); requestAnimationFrame(()=>{bar.style.transition=`width ${T}s linear`;bar.style.width='0%';});
          const hide=()=>{clearTimeout(timer);d.phase='ask';render();};
          timer=setTimeout(hide,T*1000); document.getElementById('ready').onclick=hide;
        };
      } else {
        html=`${kick}<h3>اختفت القضية! ما فصيلتها؟</h3>
          ${d.done?caseCard(cc,{label:'قضية سريعة',reveal:'hit',compact:true}):`<div class="hidden-case"><div>🙈</div>تذكّر البصمة التي رأيتها</div>`}
          ${d.done?'':famButtons(p)}<div id="fb">${d.fbHTML||''}</div>
          <div class="footer">${nextBtn(r<total-1?'الومضة التالية':'أغلق ملف النمط',!d.done)}</div>`;
        wire=()=>{
          if(!d.done) wireFam(app,cc.f,(ok,f,ms)=>{rec(cc.f,ok,ms); if(ok)addStars(1); d.fbHTML=famFeedback(p,ok,f,cc.f); d.done=true; render();});
          document.getElementById('next').onclick=advance;
        };
      }
    }
  }
  else if(st===8){
    html=`<span class="kicker">الملف المغلق</span><h3>ملف «${p.name}»</h3>
      <p class="lead">كل ما تحتاجه قبل الاختبار: البصمة والطريقة لكل فصيلة.</p>
      ${fileHTML(p,true)}
      <div class="footer">${nextBtn('احفظ الملف في ملفاتي')}<button class="wide-btn ghost" id="again">أعد القضية من البداية</button></div>`;
    wire=()=>{
      document.getElementById('next').onclick=()=>{S.learned[p.id]=true;save();go({name:'files',flash:true});};
      document.getElementById('again').onclick=()=>go({name:'lesson',pid:p.id,step:0,fi:0});
    };
  }

  app.innerHTML=top+`<div class="stage">${html}</div>`;
  document.getElementById('x').onclick=()=>go({name:'home'});
  wire();
}

function fileHTML(p,stamp){
  const col=p.kind==='verb'?'var(--verb)':'var(--math)';
  return `<div class="pc" style="--accent:${col}">
    <div class="hd"><small>${p.kind==='math'?'الكمي':'اللفظي'} · ملف نمط</small><b>${p.icon} ${p.name}</b></div>
    ${stamp?'<span class="stamp">مغلق</span>':''}
    ${p.fams.map(f=>{const F=FAM[f];return `<div class="fr"><b>${F.icon} ${F.name}</b>
      <div><span class="k">البصمة:</span> ${fx(p,F.print.join('، '))}</div>
      <div><span class="k">الطريقة:</span> ${fx(p,F.method)}</div></div>`;}).join('')}
    <div class="gold">⭐ ${p.gold}</div></div>`;
}

/* ---------- mixed line-up ---------- */
function startLineup(){
  const list=shuffle([...shuffle(CASES.filter(c=>FAM[c.f].p==='cmp')).slice(0,4),...shuffle(CASES.filter(c=>FAM[c.f].p==='ana')).slice(0,4)]).map(c=>c.id);
  go({name:'lineup',list,i:0,right:0,ms:0,done:false});
}
function lineup(){
  const v=view;
  if(v.i>=v.list.length){
    setAccent('math');
    app.innerHTML=`<div class="bar"><button class="icon-btn" id="x">✕</button><div class="title">🚨 الطابور المختلط</div></div>
      <div class="stage"><h3>انتهى الطابور</h3>
      <div class="stars"><div class="starbox on"><b>🎯</b>${nAr(v.right)} من ${nAr(v.list.length)} صحيحة</div>
        <div class="starbox on"><b>⏱️</b>${nAr((v.ms/v.list.length/1000).toFixed(1).replace('.','٫'))} ث لكل قضية</div>
        <div class="starbox on"><b>⭐</b>+${nAr(v.right)} نجوم</div></div>
      <p class="lead" style="text-align:center">عدّادات ذكاء الأنماط في الصفحة الرئيسية تحدّثت.</p>
      <div class="footer"><button class="wide-btn primary" id="again">طابور جديد</button><button class="wide-btn ghost" id="h">الرئيسية</button></div></div>`;
    document.getElementById('x').onclick=document.getElementById('h').onclick=()=>go({name:'home'});
    document.getElementById('again').onclick=startLineup;
    return;
  }
  const c=CASE[v.list[v.i]], p=patOf(c); setAccent(p.kind);
  app.innerHTML=`<div class="bar"><button class="icon-btn" id="x">✕</button><div class="title">🚨 الطابور المختلط</div></div>
    <div class="steps">${v.list.map((_,i)=>`<i class="${i<=v.i?'on':''}"></i>`).join('')}</div>
    <div class="stage"><span class="kicker">${p.icon} ${p.name} · قضية ${nAr(v.i+1)} من ${nAr(v.list.length)}</span>
      <h3>ما فصيلة هذه القضية؟</h3><p class="lead">بأسرع ما يمكن. لا تحلّ السؤال.</p>
      ${caseCard(c,{label:'مشتبه به',reveal:v.done?'hit':null})}
      ${v.done?'':famButtons(p)}<div id="fb">${v.fbHTML||''}</div>
      <div class="footer"><button class="wide-btn primary" id="next" ${v.done?'':'disabled'}>${v.i<v.list.length-1?'القضية التالية':'النتيجة'}</button></div></div>`;
  document.getElementById('x').onclick=()=>go({name:'home'});
  if(!v.done) wireFam(app,c.f,(ok,f,ms)=>{rec(c.f,ok,ms); if(ok){v.right++;addStars(1);} v.ms+=ms; v.fbHTML=famFeedback(p,ok,f,c.f); v.done=true; render();});
  document.getElementById('next').onclick=()=>{v.i++;v.done=false;v.fbHTML='';render();scrollTo(0,0);};
}

/* ---------- closed files ---------- */
function files(){
  setAccent('math');
  const mine=Object.values(PAT).filter(p=>S.learned[p.id]);
  app.innerHTML=`<div class="bar"><button class="icon-btn" id="x">→</button><div class="title">🗂️ ملفاتي المغلقة</div></div>
    ${view.flash?`<div class="fb ok" style="margin:0 0 12px"><b>تم حفظ الملف ✓</b>راجع ملفاتك قبل الاختبار بدقائق.</div>`:''}
    ${mine.length?mine.map(p=>fileHTML(p,true)+`<div style="text-align:center;margin:-6px 0 14px"><button class="small-btn" data-redo="${p.id}">أعد القضية</button></div>`).join('')
      :`<div class="empty"><div>🗂️</div>لا توجد ملفات مغلقة بعد.<br>حلّ قضية نمط لتحصل على ملفه.</div>`}
    <div class="footer"><button class="wide-btn ghost" id="h">الرئيسية</button></div>`;
  document.getElementById('x').onclick=document.getElementById('h').onclick=()=>go({name:'home'});
  app.querySelectorAll('[data-redo]').forEach(b=>b.onclick=()=>go({name:'lesson',pid:b.dataset.redo,step:0,fi:0}));
}

render();
</script>
</body>
</html>
