<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#f7f7f5">
<title>تحليل القدرات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Calm by design: one accent colour, green/red only for right/wrong, one thing per screen. */
  :root{
    color-scheme:light only;
    --bg:#f7f7f5; --card:#fff; --ink:#1f2328; --muted:#6b7280; --faint:#9aa0a8; --line:#e7e7e3;
    --accent:#2563eb; --accentSoft:#eaf0fd;
    --ok:#16a34a; --okSoft:#eaf7ee; --bad:#dc2626; --badSoft:#fdeeee;
  }
  *{box-sizing:border-box}
  html,body{margin:0;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
  body{
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    background:var(--bg);color:var(--ink);min-height:100dvh;font-size:17px;line-height:1.7;
  }
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  #app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
       padding:calc(env(safe-area-inset-top) + 10px) 20px calc(env(safe-area-inset-bottom) + 20px)}

  /* top bar */
  .top{display:flex;align-items:center;gap:12px;min-height:48px;margin-bottom:18px}
  .x{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:18px;color:var(--muted);flex:none}
  .x:active{background:#eeeeea}
  .prog{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
  .prog i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
  .pnum{font-size:14px;color:var(--muted);min-width:44px;text-align:left}

  .screen{flex:1;display:flex;flex-direction:column}
  h1{font-size:22px;margin:0}
  h2{font-size:21px;margin:0 0 4px;line-height:1.5}
  .sub{color:var(--muted);font-size:15px;margin:0 0 18px}
  .bottom{margin-top:auto;padding-top:20px;display:flex;flex-direction:column;gap:6px}
  .btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border-radius:14px;font-weight:700;font-size:17px;background:var(--accent);color:#fff}
  .btn:active{transform:scale(.98)}
  .btn:disabled{background:#d6d9de;color:#fff}
  .link{min-height:44px;color:var(--muted);font-weight:600;font-size:15px;align-self:center;padding:0 12px}
  .link:disabled{opacity:.4}

  /* the question: one quiet card, nothing nested */
  .q{background:var(--card);border-radius:18px;padding:22px 18px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .q .stem{color:var(--muted);font-size:16px;line-height:2.1;margin-bottom:14px;text-align:center}
  .q .vs{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;font-size:24px;font-weight:700;line-height:2.1}
  .q .vs .or{font-size:14px;font-weight:500;color:var(--faint)}
  .q .pair{font-size:30px;font-weight:700;text-align:center;word-spacing:6px}
  .q.small{padding:12px 14px}
  .q.small .stem{margin-bottom:4px;font-size:14px;line-height:1.8}
  .q.small .vs{font-size:18px;gap:10px;line-height:1.8}
  .q.small .pair{font-size:21px}
  .skel{font-size:17px;font-weight:600;text-align:center;color:var(--muted);padding:6px 0}

  .tok{border-radius:5px;padding:0 3px}
  .tok.tap{border-bottom:1.5px dashed #c8ccd2;cursor:pointer}
  .tok.hit{background:var(--accentSoft);box-shadow:inset 0 -2px 0 var(--accent);border-bottom-color:transparent}
  .tok.missed{box-shadow:inset 0 -2px 0 var(--bad);border-bottom-color:transparent}
  .tok.shake{animation:shake .35s}
  .tok.pulse{animation:pulse .8s 3}
  @keyframes shake{25%,75%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
  @keyframes pulse{50%{background:var(--accentSoft);box-shadow:0 0 0 3px var(--accentSoft)}}

  .status{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 0;color:var(--muted);font-size:15px}
  .dots{display:flex;gap:6px}
  .dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
  .dots i.on{background:var(--accent)}
  .msg{min-height:52px;text-align:center;color:var(--ink);font-size:15px;margin-top:10px;padding:0 8px}
  .msg.soft{color:var(--muted)}

  /* option lists: plain rows */
  .list{display:flex;flex-direction:column;gap:8px;margin-top:18px}
  .opt{display:flex;align-items:center;gap:12px;text-align:right;min-height:52px;padding:8px 14px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-size:16px}
  .opt:active{transform:scale(.985)}
  .opt .n{color:var(--faint);font-weight:700;font-size:14px;min-width:16px}
  .opt.ok{border-color:var(--ok);background:var(--okSoft)}
  .opt.bad{border-color:var(--bad);background:var(--badSoft)}
  .opt.dim{opacity:.45}
  .opt:disabled{cursor:default}
  .opt .r{margin-inline-start:auto;font-size:13px;color:var(--muted)}
  .opt.q-opt{display:block;padding:0;border-width:1.5px}
  .opt.q-opt .q{box-shadow:none;background:transparent}

  .fb{margin-top:14px;font-size:16px;text-align:center}
  .fb b{display:block}
  .fb.ok b{color:var(--ok)} .fb.bad b{color:var(--bad)}
  .why{color:var(--muted);font-size:15px;margin-top:4px}
  .why-btn{color:var(--accent);font-weight:600;font-size:15px;min-height:40px;padding:0 10px}

  .work{background:var(--card);border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .rule{font-size:16px;margin-top:2px}
  .rule b{font-weight:700}
  table.try{width:100%;border-collapse:collapse;font-size:15px}
  table.try th,table.try td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
  table.try tr:last-child td{border-bottom:0}
  table.try th{color:var(--muted);font-weight:500;font-size:13px}
  .win1,.win2,.eq{font-weight:700}
  .sent{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
  .sent:last-child{border-bottom:0}
  .mk{font-weight:700;flex:none;width:18px;text-align:center}
  .mk.y{color:var(--ok)} .mk.n{color:var(--bad)}

  /* review */
  .rows{background:var(--card);border-radius:16px;margin-top:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .row{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:16px}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--muted);min-width:64px;font-size:15px}
  .row .miss{color:var(--bad);text-decoration:line-through}
  .stars{text-align:center;font-size:26px;letter-spacing:6px;margin-top:18px;color:#d6d9de}
  .stars b{color:#eab308;font-weight:400}
  .stars small{display:block;letter-spacing:0;font-size:14px;color:var(--muted)}

  /* family intro */
  .fnum{font-size:15px;color:var(--muted)}
  .fname{font-size:28px;font-weight:700;margin:2px 0 6px}
  .fprint{font-size:17px;margin-bottom:22px}
  .pager{display:flex;justify-content:center;gap:6px;margin-bottom:16px}
  .pager i{width:7px;height:7px;border-radius:50%;background:var(--line)}
  .pager i.on{background:var(--ink)}

  .timer{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:16px}
  .timer i{display:block;height:100%;width:100%;background:var(--accent)}
  .hidden-q{background:var(--card);border-radius:18px;padding:34px 18px;text-align:center;color:var(--muted);box-shadow:0 1px 3px rgba(0,0,0,.05)}

  /* home */
  .homehead{display:flex;align-items:center;gap:10px;min-height:48px;margin-bottom:22px}
  .homehead .lv{font-size:14px;color:var(--muted);flex:1}
  .icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
  .icon-btn:active{background:#eeeeea}
  .next-card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:26px}
  .next-card small{color:var(--muted);font-size:14px}
  .next-card h2{margin:2px 0 14px}
  .plist{display:flex;flex-direction:column}
  .prow{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 2px;border-bottom:1px solid var(--line);text-align:right;width:100%}
  .prow:last-child{border-bottom:0}
  .prow .t{font-weight:600;font-size:17px}
  .prow .s{font-size:14px;color:var(--muted)}
  .prow .chev{margin-inline-start:auto;color:var(--faint);font-size:20px}
  .seclabel{font-size:14px;color:var(--muted);margin:0 2px 2px}
  .mini{height:4px;width:70px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
  .mini i{display:block;height:100%;background:var(--accent)}

  /* summary */
  .sum{background:var(--card);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .srow{display:block;width:100%;text-align:right;padding:13px 16px;border-bottom:1px solid var(--line)}
  .srow:last-child{border-bottom:0}
  .srow .t{font-weight:600;display:flex;align-items:center;gap:8px}
  .srow .t .acc{margin-inline-start:auto;font-size:13px;color:var(--muted);font-weight:500}
  .srow .p{font-size:15px;color:var(--muted)}
  .srow .mth{font-size:15px;margin-top:6px}
  .srow .chev{color:var(--faint);font-size:14px}
  .goldline{font-size:15px;color:var(--muted);text-align:center;margin-top:14px}
  .empty{text-align:center;color:var(--muted);padding:50px 16px}

  .m{direction:ltr;unicode-bidi:isolate}
  body.ar .m{direction:rtl}
  .neg{direction:ltr;unicode-bidi:isolate}
  .m{display:inline-block;font-weight:700;white-space:nowrap}
  sup{font-size:.65em}

  .scrim{position:fixed;inset:0;background:rgba(20,24,36,.3);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .2s}
  .sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 18px);animation:up .25s ease}
  .sheet h3{margin:0 0 4px}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
  .seg button{min-height:64px;border-radius:14px;border:1.5px solid var(--line);font-weight:700;line-height:1.4}
  .seg button small{display:block;font-weight:500;color:var(--muted);font-size:13px}
  .seg button.on{border-color:var(--accent);background:var(--accentSoft)}
  @keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(40px);opacity:.4}}
  .pop{animation:fade .25s}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- iPhone pinch block ---------- */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});

/* ---------- saved state (this phone only) ---------- */
const KEY='qudurat-detective-v2';
let S={learned:{},stars:0,fam:{},digits:'ar'};
try{
  const raw=localStorage.getItem(KEY);
  if(raw) S=Object.assign(S,JSON.parse(raw));
  else{const old=JSON.parse(localStorage.getItem('qudurat-patterns-v1')||'null'); if(old&&old.digits) S.digits=old.digits;}
}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- math digits ---------- */
const AR='٠١٢٣٤٥٦٧٨٩';
function conv(t){return t.replace(/(\d)\.(\d)/g,'$1٫$2').replace(/[0-9]/g,d=>AR[d]).replace(/x/g,'س').replace(/y/g,'ص').replace(/%/g,'٪').replace(/a/g,'أ').replace(/b/g,'ب');}
function M(html){
  if(S.digits!=='ar') return html;
  return html.replace(/(<[^>]*>)|([^<]+)/g,(a,tag,txt)=>tag?tag:
    conv(txt.replace(/-(\d+)/g,'\u0001$1\u0002')).replace(/\u0001([^\u0002]*)\u0002/g,'<span class="neg">$1-</span>'));
}
const m=s=>`<span class="m">${s}</span>`;
const num=n=>S.digits==='ar'?String(n).replace(/[0-9]/g,d=>AR[d]):String(n);
const nAr=n=>String(n).replace(/[0-9]/g,d=>AR[d]); // UI counters always Arabic
const L=['أ','ب','ج','د'];
const CMP=['القيمة الأولى أكبر','القيمة الثانية أكبر','القيمتان متساويتان','المعطيات غير كافية'];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.random()*a.length|0];

/* ---------- patterns and their families ---------- */
const PAT={
  cmp:{id:'cmp',kind:'math',icon:'كمي',name:'المقارنات الكمية',short:'من الأكبر؟ القيمة الأولى أم الثانية؟',fams:['var','nums','swap','neg'],big:'v1',
       gold:'البصمة ← الفصيلة ← الطريقة ← الجواب. لا تبدأ الحساب قبل أن تعرف الفصيلة.'},
  ana:{id:'ana',kind:'verb',icon:'لفظي',name:'التناظر اللفظي',short:'كلمتان بينهما علاقة. ما نوعها؟',fams:['part','place','cause','stage','tool','opp'],big:'st1',
       gold:'سمِّ العلاقة بجملة قبل أن تنظر إلى الخيارات.'}
};
const FAM={
  var:{p:'cmp',icon:'١',name:'المتغيّر الحر',print:['يوجد حرف مثل '+m('x')+' أو '+m('y'),'قيمته غير محددة (أو لها شرط فقط)'],
       method:'جرّب قيمًا مختلفة: '+m('0')+'، '+m('1')+'، '+m('-1')+'، '+m('½')+'، '+m('10')+'. إذا تغيّر الفائز ← (د).',skel:'قارن: [عبارة فيها حرف] مع [عبارة أخرى]'},
  nums:{p:'cmp',icon:'٢',name:'أعداد صريحة',print:['لا يوجد أي حرف','أرقام وعمليات فقط'],
       method:'احسب أو قرّب بسرعة. الجواب <b>لا يمكن</b> أن يكون (د).',skel:'قارن: [أرقام وعمليات] مع [رقم]'},
  swap:{p:'cmp',icon:'٣',name:'النسب المتبادلة',print:['«٪ من» في الطرفين','نفس العددين تبادلا المكان'],
       method:m('a%')+' من '+m('b')+' = '+m('b%')+' من '+m('a')+' دائمًا ← متساويتان (ج) بدون حساب.',skel:'قارن: [■٪ من ▲] مع [▲٪ من ■]'},
  neg:{p:'cmp',icon:'٤',name:'قوى السالب',print:['عدد سالب داخل قوس','وعليه أس (قوة)'],
       method:'الأس الزوجي يجعله موجبًا، والأس الفردي يبقيه سالبًا. والموجب أكبر.',skel:'قارن: [(سالب) أس زوجي] مع [(سالب) أس فردي]'},
  part:{p:'ana',icon:'١',name:'جزء وكل',print:['الأول قطعة من الثاني','جملته: «الأول جزء من الثاني»'],
       method:'قل: «… جزء من …» وجرّبها على كل خيار.',skel:'[قطعة] : [الشيء الكامل]'},
  place:{p:'ana',icon:'٢',name:'عامل ومكان',print:['الأول شخص له مهنة','الثاني مكان عمله'],
       method:'قل: «… يعمل في …» وجرّبها على كل خيار.',skel:'[شخص يعمل] : [مكان عمله]'},
  cause:{p:'ana',icon:'٣',name:'سبب ونتيجة',print:['الأول تصرّف أو حدث','الثاني ما ينتج عنه'],
       method:'قل: «… يؤدي إلى …» وانتبه للاتجاه.',skel:'[تصرّف أو حدث] : [ما ينتج عنه]'},
  stage:{p:'ana',icon:'٤',name:'مرحلة وتطوّر',print:['الأول كائن في بدايته','الثاني نفس الكائن بعد أن يكبر'],
       method:'قل: «… يكبر فيصبح …» وانتبه للاتجاه.',skel:'[كائن صغير] : [نفس الكائن كبيرًا]'},
  tool:{p:'ana',icon:'٥',name:'أداة واستخدام',print:['الأول أداة أو شيء','الثاني الفعل الذي يقوم به'],
       method:'قل: «… يُستخدم لـ…» وجرّبها على كل خيار.',skel:'[أداة] : [ما تفعله]'},
  opp:{p:'ana',icon:'٦',name:'تضاد',print:['كلمتان من نفس النوع','معناهما معاكس'],
       method:'قل: «… عكس …» وتأكد أن الكلمتين من نفس النوع.',skel:'[صفة أو شيء] : [عكسه تمامًا]'}
};

/* ---------- cases (few on purpose: the pattern is what matters) ---------- */
const DEC_CMP=['قارن بين:','d','موجودة في كل أسئلة المقارنة، فلا تكشف الفصيلة'];
const DEC_ANA=['اختر الزوج الذي له نفس العلاقة:','d','جملة ثابتة في كل أسئلة التناظر، فلا تكشف نوع العلاقة'];
const C=(id,f,a,b,stem)=>({id,f,a,b,stem:stem||[DEC_CMP]});
const V=(id,f,w1,n1,w2,n2)=>({id,f,pair:[[w1,'c',n1],[':'],[w2,'c',n2]],stem:[DEC_ANA]});
const CASES=[
  Object.assign(C('v1','var',[m('x<sup>2</sup>'),'c','تربيع: يكبر مع الأعداد الكبيرة لكنه يصغر مع الكسور'],[m('x')],
    [['إذا كان'],[m('x'),'c','حرف، أي قيمة غير معروفة'],['عددًا حقيقيًا','c','«حقيقي» يشمل الكسور والسالب والصفر، فلا قيود'],['، قارن بين:']]),{
    choices:CMP,ans:3,
    work:()=>`<table class="try">
      <tr><th>نجرّب</th><th>الأولى ${m('x<sup>2</sup>')}</th><th>الثانية ${m('x')}</th><th>الفائز</th></tr>
      <tr><td>${m('x = 2')}</td><td>${m('4')}</td><td>${m('2')}</td><td class="win1">الأولى</td></tr>
      <tr><td>${m('x = ½')}</td><td>${m('¼')}</td><td>${m('½')}</td><td class="win2">الثانية</td></tr>
      <tr><td>${m('x = 1')}</td><td>${m('1')}</td><td>${m('1')}</td><td class="eq">تعادل</td></tr></table>`,
    why:['جرّبت عددًا كبيرًا فقط. مع '+m('½')+' تفوز الثانية.','جرّبت كسرًا فقط. مع '+m('2')+' تفوز الأولى.','جرّبت '+m('0')+' أو '+m('1')+' فقط، وهذا فخ مقصود.','الفائز تغيّر بين التجارب، فالمعطيات غير كافية.'],
    answerLabel:'(د) المعطيات غير كافية'}),
  C('v2','var',[m('x + 3')],[m('3x'),'c','حرف مضروب في عدد، يتغيّر بسرعة'],
    [['إذا كان'],[m('x > 0'),'c','حرف له شرط: جرّب فقط أعدادًا موجبة، كسرًا وعددًا كبيرًا'],['، قارن بين:']]),
  C('v3','var',[m('2y')],[m('y')],
    [['إذا كان'],[m('y'),'c','حرف، أي قيمة غير معروفة'],['عددًا صحيحًا','c','«صحيح» يشمل الصفر والسالب'],['، قارن بين:']]),
  C('n1','nums',[m('3 × 17'),'c','أرقام وعمليات فقط، لا حروف'],[m('50'),'c','عدد صريح']),
  C('n2','nums',[m('100 − 37'),'c','أرقام وعمليات فقط، لا حروف'],[m('64'),'c','عدد صريح']),
  C('n3','nums',[m('½ + ¼'),'c','كسور صريحة، لا حروف'],[m('0.75'),'c','عدد صريح']),
  C('s1','swap',[m('25%')+' من '+m('80'),'c','«٪ من»: نسبة من عدد'],[m('80%')+' من '+m('25'),'c','نفس العددين، لكن تبادلا المكان']),

function toks(c){
  if(c._t) return c._t;
  const out=[]; const add=(t,pl)=>out.push({t:t[0],k:t[1],n:t[2],pl});
  c.stem.forEach(t=>add(t,'stem'));
  if(c.a){add(c.a,'a');add(c.b,'b');} else c.pair.forEach(t=>add(t,'pair'));
  return c._t=out;
}
const clueIdx=c=>toks(c).map((t,i)=>t.k==='c'?i:-1).filter(i=>i>=0);

function rank(){

}
function addStars(n){S.stars=(S.stars||0)+n;save();}
function rec(f,ok,ms){const r=S.fam[f]||(S.fam[f]={n:0,ok:0,ms:0}); r.n++; if(ok)r.ok++; r.ms+=Math.min(ms,60000); save();}
function famAcc(f){const s=S.fam[f]; return s&&s.n?Math.round(s.ok/s.n*100):null;}
function patAcc(p){const a=p.fams.map(famAcc).filter(x=>x!==null); return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;}

/* "why?" links reveal one short explanation on demand */
document.addEventListener('click',e=>{const b=e.target.closest('[data-why]'); if(b){b.nextElementSibling.hidden=false;b.remove();}});
const why=html=>`<button class="why-btn" data-why>لماذا؟</button><div class="why" hidden>${html}</div>`;

/* the question, shown as one quiet card */
function qView(c,o={}){
  const p=patOf(c), T=toks(c);
  const tk=i=>{const t=T[i]; let cls='tok';
    if(o.tap) cls+=' tap';
    if(o.found&&o.found.includes(i)) cls+=' hit';
    else if(o.reveal&&t.k==='c') cls+=o.reveal==='missed'?' missed':' hit';
    return `<span class="${cls}" data-t="${i}">${t.t}</span>`;};
  const idx=pl=>T.map((t,i)=>t.pl===pl?i:-1).filter(i=>i>=0);
  let inner;
  if(o.skel) inner=`<div class="skel">${FAM[c.f].skel}</div>`;
  else{
    let si=idx('stem'); if(o.small) si=si.filter(i=>T[i].k!=='d'&&!/قارن/.test(T[i].t));
    const stem=si.map(i=>(/^[،,]/.test(T[i].t)?'':' ')+tk(i)).join('').trim();
    inner=stem?`<div class="stem">${stem}</div>`:'';
    if(c.a) inner+=`<div class="vs">${tk(idx('a')[0])}<span class="or">مقابل</span>${tk(idx('b')[0])}</div>`;
    else inner+=`<div class="pair">${idx('pair').map(tk).join(' ')}</div>`;
  }
  return fx(p,`<div class="q ${o.small?'small':''}">${inner}</div>`);
}
const famList=p=>`<div class="list">${p.fams.map((f,i)=>`<button class="opt" data-f="${f}"><span class="n">${nAr(i+1)}</span><span>${FAM[f].name}</span></button>`).join('')}</div>`;
function wireFam(right,cb){
  const t0=performance.now(), btns=[...app.querySelectorAll('.opt[data-f]')];
  btns.forEach(b=>b.onclick=()=>{
    const f=b.dataset.f, ok=f===right;
    btns.forEach(x=>{x.disabled=true; if(x.dataset.f===right)x.classList.add('ok'); else if(x===b)x.classList.add('bad'); else x.classList.add('dim');});
    cb(ok,f,performance.now()-t0);
  });
}
const famFb=(p,ok,right)=>`<div class="fb ${ok?'ok':'bad'} pop"><b>${ok?'صحيح':'الإجابة: '+FAM[right].name}</b>${why('البصمة: '+fx(p,famLine(right)))}</div>`;

    <div class="seclabel" style="margin-top:22px">المزيد</div>

/* ---------- lesson: one thing per screen ---------- */
function lesson(){
  const p=PAT[view.pid], seq=seqOf(p), sc=seq[view.k], c=CASE[p.big];
  S.resume[p.id]=Object.assign({},view); save();
  let html='', wire=()=>{};
  const next=()=>{clearTimeout(timer); view.k++; view.d=null; view.msg=''; render(); scrollTo(0,0);};
  const btn=(label,dis)=>`<button class="btn" id="next" ${dis?'disabled':''}>${label}</button>`;
  const enable=()=>{const n=document.getElementById('next'); if(n)n.disabled=false;};
  const bindNext=()=>{const n=document.getElementById('next'); if(n) n.onclick=next;};

  if(sc.t==='fam'){
    const f=p.fams[sc.i], F=FAM[f], ex=casesOf(f).find(x=>x.id!==p.big)||casesOf(f)[0];
    html=`${sc.i===0?`<p class="sub">لأسئلة «${p.name}» ${nAr(p.fams.length)} فصائل. لكل واحدة بصمة تكشفها.</p>`:''}
      <div class="fnum">الفصيلة ${nAr(sc.i+1)} من ${nAr(p.fams.length)}</div>
      <div class="fname">${F.name}</div>
      <div class="fprint">${fx(p,famLine(f))}</div>
      <div class="seclabel">مثال</div>${qView(ex,{reveal:'hit'})}
      <div class="bottom">${btn('التالي')}</div>`;
    wire=bindNext;
  }
  else if(sc.t==='clues'){
    const cl=clueIdx(c), found=view.found||(view.found=[]);
    html=`<h2>ما الذي يكشف نوع السؤال؟</h2><p class="sub">اضغط على الكلمات التي تعتبرها أدلة.</p>
      ${qView(c,{tap:true,found})}
      <div class="status"><span class="dots">${cl.map((_,i)=>`<i class="${i<found.length?'on':''}"></i>`).join('')}</span>${nAr(found.length)} من ${nAr(cl.length)}</div>
      <div class="msg ${view.msg?'':'soft'}" id="msg">${view.msg||''}</div>
      <div class="bottom">${btn('التالي',found.length===0)}
        <button class="link" id="hint" ${view.hint||found.length===cl.length?'disabled':''}>تلميح</button></div>`;
    wire=()=>{
      const msg=document.getElementById('msg');
      app.querySelectorAll('.tok.tap').forEach(el=>el.onclick=()=>{
        const i=+el.dataset.t, t=toks(c)[i];
        if(t.k==='c'){ if(!found.includes(i)){found.push(i); view.msg=fx(p,`<b>${t.t}</b>: ${t.n}`); render();} }
        else{ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
          msg.className='msg soft'; msg.innerHTML='ليست دليلًا'+(t.k==='d'?`: ${t.n}`:''); }
      });
      document.getElementById('hint').onclick=()=>{
        view.hint=true; view.msg='الكلمة المضيئة دليل.'; const miss=cl.find(i=>!found.includes(i)); render();
        const el=app.querySelector(`[data-t="${miss}"]`); if(el) el.classList.add('pulse');
      };
      document.getElementById('next').onclick=()=>{view.nameOk=null;next();};
    };
  }
  else if(sc.t==='name'){
    html=`<h2>ما فصيلة هذا السؤال؟</h2><p class="sub">اعتمد على الأدلة، ولا تحلّ بعد.</p>
      ${qView(c,{found:view.found,small:true})}${famList(p)}<div id="fb"></div>
      <div class="bottom">${btn('التالي',true)}</div>`;
    wire=()=>{
      wireFam(c.f,(ok,f,ms)=>{view.nameOk=ok;view.nameMs=ms;rec(c.f,ok,ms);document.getElementById('fb').innerHTML=famFb(p,ok,c.f);enable();});
      bindNext();
    };

  else if(sc.t==='work'){

        document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'} pop"><b>${ok?'صحيح':'غير صحيح'}</b>${why(fx(p,c.why[k]))}</div>`;
        enable();
      });
      bindNext();
    };

  else if(sc.t==='review'){

    const d=view.d;
    html=`<h2>ما الفصيلة المشتركة؟</h2><p class="sub">ثلاثة أسئلة بشكل مختلف، من فصيلة واحدة.</p>

    wire=()=>{
      if(!d.done) wireFam(d.f,(ok,f,ms)=>{rec(d.f,ok,ms); if(ok)addStars(1); d.fb=famFb(p,ok,d.f); d.done=true; render();});

    html=`<h2>أيّها مختلف؟</h2><p class="sub">سؤالان من فصيلة واحدة، والثالث من غيرها.</p>
      <div class="list" style="margin-top:0">${d.cs.map((id,i)=>`<button class="opt q-opt ${done?(i===d.odd?'ok':i===d.pick?'bad':'dim'):''}" data-pick="${i}" ${done?'disabled':''}>${qView(CASE[id],{small:true})}</button>`).join('')}</div>
      ${done?`<div class="fb ${d.pick===d.odd?'ok':'bad'} pop"><b>${d.pick===d.odd?'صحيح':'المختلف هو المحدّد بالأخضر'}</b>${why(`المختلف من «${FAM[d.B].name}»، والآخران من «${FAM[d.A].name}».`)}</div>`:''}
      <div class="bottom">${btn('التالي',!done)}</div>`;
    wire=()=>{
      if(!done) app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{d.pick=+b.dataset.pick; if(d.pick===d.odd)addStars(1); render();});
      bindNext();
    };
  }
  else if(sc.t==='flash'){
    if(!view.d){view.d={id:pick(CASES.filter(x=>FAM[x.f].p===p.id&&x.id!==view.lastFlash)).id,phase:'show'}; view.lastFlash=view.d.id;}
    const d=view.d, cc=CASE[d.id];
    if(d.phase==='show'){
      html=`<h2>تعرّف سريع</h2><p class="sub">${nAr(sc.T)} ثوانٍ. التقط الفصيلة فقط.</p>
        <div class="timer"><i id="tb"></i></div>${qView(cc)}
        <div class="bottom"><button class="link" id="hide">أخفِ الآن</button></div>`;
      wire=()=>{
        const bar=document.getElementById('tb'); requestAnimationFrame(()=>{bar.style.transition=`width ${sc.T}s linear`;bar.style.width='0%';});
        const hide=()=>{clearTimeout(timer);d.phase='ask';render();};
        timer=setTimeout(hide,sc.T*1000); document.getElementById('hide').onclick=hide;
      };
    } else {
      html=`<h2>ما فصيلته؟</h2><p class="sub">من الذاكرة.</p>
        ${d.done?qView(cc,{small:true,reveal:'hit'}):'<div class="hidden-q">السؤال مخفي</div>'}
        ${d.done?d.fb:famList(p)}
        <div class="bottom">${btn('التالي',!d.done)}</div>`;
      wire=()=>{
        if(!d.done) wireFam(cc.f,(ok,f,ms)=>{rec(cc.f,ok,ms); if(ok)addStars(1); d.fb=famFb(p,ok,cc.f); d.done=true; render();});
        bindNext();
      };
    }
  }
  else if(sc.t==='summary'){
    html=`<h2>ملخص ${p.name}</h2><p class="sub">اضغط على أي فصيلة لترى طريقتها.</p>
      ${sumHTML(p)}
      <div class="bottom">${btn('حفظ والعودة')}</div>`;
    wire=()=>{wireSum(); document.getElementById('next').onclick=()=>{S.learned[p.id]=true; delete S.resume[p.id]; save(); go({name:'home'});};};
  }

  app.innerHTML=topbar(view.k+1,seq.length)+`<div class="screen">${html}</div>`;
  document.getElementById('x').onclick=()=>go({name:'home'});
  wire();
}

function sumHTML(p){
  return `<div class="sum">${p.fams.map(f=>{const F=FAM[f], a=famAcc(f);
    return `<button class="srow"><div class="t">${F.name}${a!==null?`<span class="acc">دقتك ${nAr(a)}٪</span>`:''}<span class="chev">⌄</span></div>
      <div class="p">${fx(p,famLine(f))}</div><div class="mth" hidden>${fx(p,F.method)}</div></button>`;}).join('')}</div>
    <div class="goldline">${p.gold}</div>`;
}
function wireSum(){app.querySelectorAll('.srow').forEach(r=>r.onclick=()=>{const m=r.querySelector('.mth'); m.hidden=!m.hidden;});}

/* ---------- mixed line-up ---------- */
function startLineup(){
  const list=shuffle([...shuffle(CASES.filter(c=>FAM[c.f].p==='cmp')).slice(0,4),...shuffle(CASES.filter(c=>FAM[c.f].p==='ana')).slice(0,4)]).map(c=>c.id);
  go({name:'lineup',list,i:0,right:0,ms:0,done:false});
}
function lineup(){
  const v=view;
  if(v.i>=v.list.length){
    app.innerHTML=`<div class="top"><button class="x" id="x">✕</button></div>
      <div class="screen"><h2>النتيجة</h2>
      <div class="rows">
        <div class="row"><span class="k">صحيحة</span><span>${nAr(v.right)} من ${nAr(v.list.length)}</span></div>
        <div class="row"><span class="k">المتوسط</span><span>${nAr((v.ms/v.list.length/1000).toFixed(1)).replace('.','٫')} ثانية لكل سؤال</span></div>
        <div class="row"><span class="k">النقاط</span><span>+${nAr(v.right)}</span></div>
      </div>
      <div class="bottom"><button class="btn" id="again">اختبار جديد</button><button class="link" id="h">الرئيسية</button></div></div>`;
    document.getElementById('x').onclick=document.getElementById('h').onclick=()=>go({name:'home'});
    document.getElementById('again').onclick=startLineup;
    return;
  }
  const c=CASE[v.list[v.i]], p=patOf(c);
  app.innerHTML=topbar(v.i+1,v.list.length)+`<div class="screen">
      <h2>ما الفصيلة؟</h2><p class="sub">${p.name} · بسرعة، دون حل.</p>
      ${qView(c,{small:v.done,reveal:v.done?'hit':null})}
      ${v.done?v.fb:famList(p)}
      <div class="bottom"><button class="btn" id="next" ${v.done?'':'disabled'}>${v.i<v.list.length-1?'التالي':'النتيجة'}</button></div></div>`;
  document.getElementById('x').onclick=()=>go({name:'home'});
  if(!v.done) wireFam(c.f,(ok,f,ms)=>{rec(c.f,ok,ms); if(ok){v.right++;addStars(1);} v.ms+=ms; v.fb=famFb(p,ok,c.f); v.done=true; render();});
  document.getElementById('next').onclick=()=>{v.i++;v.done=false;v.fb='';render();scrollTo(0,0);};
}

/* ---------- summaries ---------- */
function files(){
  const mine=Object.values(PAT).filter(p=>S.learned[p.id]);
  app.innerHTML=`<div class="top"><button class="x" id="x">✕</button><div style="font-weight:700">الملخصات</div></div>
    <div class="screen">${mine.length?mine.map(p=>`<div class="seclabel" style="margin-top:6px">${p.name}</div>${sumHTML(p)}<div style="height:18px"></div>`).join('')
      :'<div class="empty">لا توجد ملخصات بعد.<br>أكمل درس نمط ليُحفظ ملخصه هنا.</div>'}</div>`;
  document.getElementById('x').onclick=()=>go({name:'home'});
  wireSum();
}

render();
</script>
</body>
</html>
