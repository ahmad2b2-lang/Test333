<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#ef6c1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Shop">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Family Shop</title>
<style>
:root{color-scheme:light only;--a:#ef6c1a;--a-d:#c9530c;--a2:#fff0e4;--bg:#fff8f1;--card:#fff;--tx:#2b2118;--mu:#7a6a5c;--ln:#f1e3d5;--ok:#2e8b57;--ok2:#e5f4ea;--bad:#d64545;--r:18px}
*{box-sizing:border-box}
html,body{margin:0;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
 font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif;background:var(--bg);color:var(--tx);min-height:100dvh;font-size:16px;line-height:1.4}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
input,textarea,select{font-size:16px;font-family:inherit;color:inherit}
img{-webkit-user-drag:none}
button{font-family:inherit;font-size:16px;cursor:pointer;color:inherit;border:0;background:none;padding:0}
.hidden{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--a);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(150,60,0,.18)}
.top h1{font-size:20px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{background:rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:0 14px;min-height:40px;display:flex;align-items:center;gap:6px;font-weight:600;max-width:52vw}
.chip span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:rgba(255,255,255,.18)}

main{max-width:680px;margin:0 auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 96px)}
main.withbar{padding-bottom:calc(env(safe-area-inset-bottom) + 160px)}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--ln);display:flex;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
.tabs button{flex:1;min-height:56px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;color:var(--mu);position:relative}
.tabs button .i{font-size:24px;line-height:1}
.tabs button.on{color:var(--a-d);background:var(--a2)}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:999px;font-size:12px;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center;font-weight:700}

/* common */
h2{font-size:22px;margin:4px 2px 12px}
h3{font-size:15px;margin:18px 4px 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--mu)}
.btn{min-height:52px;border-radius:16px;padding:0 20px;font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--a);color:#fff;box-shadow:0 3px 0 var(--a-d)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--a-d)}
.btn.light{background:var(--a2);color:var(--a-d);box-shadow:none}
.btn.ghost{background:#fff;color:var(--tx);border:1px solid var(--ln);box-shadow:none}
.btn.danger{background:#fdeaea;color:var(--bad);box-shadow:none}
.btn.ok{background:var(--ok);box-shadow:0 3px 0 #226b42}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.empty{text-align:center;padding:40px 16px;color:var(--mu)}
.empty .big{font-size:56px;margin-bottom:8px}
.empty p{margin:6px 0 18px}

/* who */
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.who button{background:#fff;border-radius:var(--r);min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:700;box-shadow:0 3px 14px rgba(120,60,10,.08);border:2px solid transparent;padding:10px}
.who button .e{font-size:48px;line-height:1}
.who button:active{transform:scale(.97);border-color:var(--a)}
.link{display:block;margin:28px auto 0;color:var(--mu);font-weight:600;min-height:44px;padding:0 14px}

/* shop */
.seg{display:flex;background:#fff;border-radius:16px;padding:4px;gap:4px;border:1px solid var(--ln)}
.seg button{flex:1;min-height:48px;border-radius:12px;font-weight:700;font-size:16px;color:var(--mu)}
.seg button.on{background:var(--a);color:#fff}
.search{position:relative;margin-bottom:10px}
.search input{width:100%;min-height:50px;border-radius:16px;border:1px solid var(--ln);background:#fff;padding:0 44px 0 44px;outline:none}
.search input:focus{border-color:var(--a)}
.search .s{position:absolute;left:14px;top:13px;font-size:18px;opacity:.6}
.search .x{position:absolute;right:4px;top:3px;width:44px;height:44px;font-size:18px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.card{background:#fff;border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 3px 14px rgba(120,60,10,.07);border:2px solid transparent}
.card.sel{border-color:var(--a)}
.pic{width:100%;aspect-ratio:1/1;border-radius:14px;background:var(--a2);display:grid;place-items:center;object-fit:cover;font-size:58px;line-height:1;overflow:hidden}
.card .nm{font-weight:700;font-size:16px;line-height:1.25;min-height:2.5em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .un{font-size:13px;color:var(--mu);margin-top:-4px}
.onlist{font-size:12px;color:var(--ok);font-weight:700;background:var(--ok2);border-radius:8px;padding:2px 8px;align-self:flex-start}
.add{min-height:46px;border-radius:14px;background:var(--a2);color:var(--a-d);font-weight:800;font-size:17px;width:100%}
.add:active{background:#ffe0c8}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--a);border-radius:14px;color:#fff;min-height:46px}
.step button{width:46px;height:46px;font-size:24px;font-weight:800;color:#fff;border-radius:14px}
.step button:active{background:rgba(0,0,0,.12)}
.step b{font-size:18px;text-align:center;flex:1}
.step.sm{min-height:44px;min-width:136px}
.step.sm button{width:44px;height:44px}
.card.other{background:transparent;border:2px dashed #e5c9b0;box-shadow:none;justify-content:center;align-items:center;text-align:center;color:var(--a-d);font-weight:700;min-height:200px}
.card.other .e{font-size:40px}

.bbar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 80px);z-index:19;max-width:656px;margin:0 auto;background:var(--tx);color:#fff;border-radius:18px;min-height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:17px}

/* rows */
.list{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:0 3px 14px rgba(120,60,10,.07)}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--ln);min-height:68px}
.row:last-child{border-bottom:0}
.row .th{width:48px;height:48px;border-radius:12px;flex:none;font-size:30px;background:var(--a2);display:grid;place-items:center;object-fit:cover;overflow:hidden}
.row .bd{flex:1;min-width:0}
.row .t{font-weight:700;overflow-wrap:anywhere}
.row .s{font-size:14px;color:var(--mu);margin-top:2px}
.row .q{font-weight:800;color:var(--a-d);white-space:nowrap;font-size:17px}
.row.done .t{text-decoration:line-through;color:var(--mu)}
.row.done .q{color:var(--ok)}
.row.tap:active{background:#fffaf5}
.who-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.wc{font-size:13px;background:#f6efe8;border-radius:999px;padding:3px 10px;display:inline-flex;align-items:center;gap:4px;min-height:28px}
.wc.mine{background:var(--a2);color:var(--a-d);font-weight:600}
.wc button{width:28px;height:28px;margin:-4px -8px -4px 0;font-size:14px;color:var(--a-d)}
.chk{width:34px;height:34px;border-radius:10px;border:2.5px solid #d9c3ae;flex:none;display:grid;place-items:center;font-size:20px;color:#fff;font-weight:900}
.row.done .chk{background:var(--ok);border-color:var(--ok)}
.xbtn{width:44px;height:44px;border-radius:12px;color:var(--mu);font-size:18px;flex:none}
.note{background:#fffbe6;border:1px solid #f4e3a1;border-radius:16px;padding:12px 14px;margin-bottom:10px}
.note .by{font-size:13px;color:var(--mu);font-weight:700;margin-bottom:2px}
.tag{font-size:12px;background:#eee;color:#666;border-radius:8px;padding:2px 8px;margin-left:6px;font-weight:600}
textarea,.inp{width:100%;border:1px solid var(--ln);border-radius:14px;padding:12px 14px;background:#fff;outline:none;min-height:50px}
textarea{min-height:84px;resize:vertical}
textarea:focus,.inp:focus{border-color:var(--a)}
.summary{display:flex;gap:10px;margin-bottom:12px}
.summary div{flex:1;background:#fff;border-radius:16px;padding:12px;text-align:center;box-shadow:0 3px 14px rgba(120,60,10,.06)}
.summary b{display:block;font-size:26px}
.summary span{font-size:13px;color:var(--mu)}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}

/* sheet */
.wrap{position:fixed;inset:0;z-index:50;background:rgba(30,15,5,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s}
.wrap.on{opacity:1;pointer-events:auto}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:92dvh;overflow:auto;transform:translateY(30px);transition:transform .2s}
.wrap.on .sheet{transform:none}
.sheet h2{margin-top:0}
.fl{font-size:14px;font-weight:700;color:var(--mu);margin:14px 2px 6px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;padding:0 14px;border-radius:12px;background:#fff;border:1px solid var(--ln);font-weight:600}
.chips button.on{background:var(--a);border-color:var(--a);color:#fff}
.emos{display:flex;flex-wrap:wrap;gap:6px}
.emos button{width:46px;height:46px;font-size:26px;border-radius:12px;background:#fff;border:1px solid var(--ln)}
.emos button.on{border:2px solid var(--a);background:var(--a2)}
.photo{display:flex;gap:12px;align-items:center}
.photo .pv{width:96px;height:96px;border-radius:18px;background:var(--a2);display:grid;place-items:center;font-size:56px;object-fit:cover;flex:none;overflow:hidden}
.photo .bt{display:flex;flex-direction:column;gap:8px;flex:1}
.photo .bt .btn{min-height:46px;font-size:15px}
.sw{display:flex;align-items:center;gap:12px;min-height:52px;background:#fff;border:1px solid var(--ln);border-radius:14px;padding:0 14px;margin-top:14px;font-weight:600}
.sw input{width:24px;height:24px;accent-color:var(--a)}
.two{display:flex;gap:10px;margin-top:20px}
.two .btn{flex:1}
.qrow{display:flex;align-items:center;gap:12px}

/* pin */
.pinv{min-height:calc(100dvh - 140px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px}
.pinv h2{margin:0 0 6px}
.pinv p{margin:0 0 20px;color:var(--mu);min-height:22px}
.pinv p.err{color:var(--bad);font-weight:600}
.dots{display:flex;gap:16px;margin-bottom:26px}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--a);display:block}
.dots i.on{background:var(--a)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{height:76px;border-radius:50%;background:#fff;font-size:28px;font-weight:600;box-shadow:0 3px 10px rgba(120,60,10,.08)}
.pad button:active{background:var(--a2)}
.pad button.blank{visibility:hidden}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 74px);transform:translateX(-50%) translateY(-20px);background:var(--tx);color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;z-index:60;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.offline{background:#fff3cd;color:#7a5a00;text-align:center;font-size:14px;padding:6px;font-weight:600}
.success{text-align:center;padding:40px 10px}
.success .big{font-size:80px}
</style>
</head>
<body>
<header class="top" id="top"></header>
<div id="off" class="offline hidden">You're offline. Showing the last saved list.</div>
<main id="app"></main>
<div id="bbar" class="bbar hidden"></div>
<nav id="tabs" class="tabs hidden"></nav>
<div id="wrap" class="wrap"></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mk=store=>({get(k,d){try{const v=store().getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{store().setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{store().removeItem(k)}catch(e){}}});
const LS=mk(()=>localStorage), SS=mk(()=>sessionStorage);

let sb=null;
try{sb=supabase.createClient('https://bhfgwlkzkbwcwyoypwhy.supabase.co','sb_publishable_9YylflVQca-62NHsBKSTeA_GY896nj3');}catch(e){}

const UNITS={piece:['piece','pieces'],pack:['pack','packs'],bottle:['bottle','bottles'],can:['can','cans'],box:['box','boxes'],
  bag:['bag','bags'],carton:['carton','cartons'],kg:['kg','kg'],liter:['liter','liters'],dozen:['dozen','dozen']};
const HALF={kg:1,liter:1};
const FOOD_EMO='🍎🍌🍇🍓🍊🍉🥑🥕🥔🧅🍅🥒🥬🍞🥐🧀🥚🥛🍗🥩🐟🍚🍝🍕🍔🥫🍪🍫🍩🍦🍯🧈🥣🌶️🫒🥜'.match(/\p{Extended_Pictographic}️?/gu);
const DRINK_EMO='🥤🧃💧🥛☕🍵🧋🍹🥥🍋🧊🫖🍶'.match(/\p{Extended_Pictographic}️?/gu);
const FACE_EMO='🙂😀😎🤓🥳😇👩👨👧👦👵👴👶🧕🧔🐱🐶🦁🐻🦄⭐'.match(/\p{Extended_Pictographic}️?/gu);
const ERR={wrong_pin:'Wrong PIN',locked:'Too many wrong tries. Wait 15 minutes.',no_pin:'No PIN set yet',bad_data:'Please check the details',
  network:'No internet. Try again.',server:'Something went wrong. Try again.',no_member:'Your name was removed. Pick your name again.',not_found:'That item no longer exists'};

let S=LS.get('fs.state',{ok:true,has_pin:true,members:[],products:[],requests:[]});
let me=LS.get('fs.me',null);
let basket=LS.get('fs.basket',{items:{},custom:[],note:''});
let PIN=SS.get('fs.pin',null);
let imgs=LS.get('fs.imgs',{});
let view=me?'shop':'who', cat=LS.get('fs.cat','food'), q='', adminTab='list', loaded=false, justSent=false;
let pinMode='enter',pinBuf='',pinFirst='',pinMsg='',pinErr=false,pinBusy=false;

const meM=()=>S.members.find(m=>m.id===me);
const prodById=id=>S.products.find(p=>p.id===id);
const saveBasket=()=>LS.set('fs.basket',basket);
const fmt=n=>{n=+n;return Number.isInteger(n)?String(n):String(Math.round(n*100)/100)};
const unitTxt=(u,n)=>{const x=UNITS[u]||[u,u];return +n===1?x[0]:x[1]};
const qtyTxt=(n,u)=>fmt(n)+' '+unitTxt(u||'piece',n);
const stepOf=u=>HALF[u]?0.5:1;

/* ---------- server ---------- */
async function rpc(n,a){
  if(!sb)return{ok:false,error:'network'};
  try{const {data,error}=await sb.rpc(n,a||{});if(error)return{ok:false,error:'server',msg:error.message};return data??{ok:false,error:'server'}}
  catch(e){return{ok:false,error:'network'}}
}
async function arpc(n,a){
  const r=await rpc(n,Object.assign({p_pin:PIN},a));
  if(r&&['wrong_pin','no_pin','locked'].includes(r.error)){PIN=null;SS.del('fs.pin');view='pin';pinMsg=ERR[r.error];pinErr=true;render();}
  else if(!r||r.ok===false)toast(ERR[r&&r.error]||ERR.server);
  else ping();
  return r||{ok:false};
}
let ch=null;
try{if(sb){ch=sb.channel('family-shop-live');ch.on('broadcast',{event:'changed'},()=>refresh()).subscribe();}}catch(e){}
function ping(){try{ch&&ch.send({type:'broadcast',event:'changed',payload:{}})}catch(e){}}

let refreshing=false;
async function refresh(){
  if(refreshing)return;refreshing=true;
  const r=await rpc('fs_state');refreshing=false;
  $('off').classList.toggle('hidden',!!(r&&r.ok)||!loaded&&!S.members.length);
  if(r&&r.ok){
    S=r;loaded=true;LS.set('fs.state',S);
    if(me&&!meM()){me=null;LS.del('fs.me');if(['shop','basket','list'].includes(view))view='who';}
    loadImages();softRender();
  }else if(!loaded){loaded=true;softRender();}
}
async function loadImages(){
  const ids=new Set(S.products.map(p=>p.id));let ch2=false;
  for(const k of Object.keys(imgs))if(!ids.has(k)){delete imgs[k];ch2=true}
  const need=S.products.filter(p=>p.has_image&&(!imgs[p.id]||imgs[p.id].v!==p.ver)).map(p=>p.id);
  for(const p of S.products)if(!p.has_image&&imgs[p.id]){delete imgs[p.id];ch2=true}
  for(let i=0;i<need.length;i+=15){
    const part=need.slice(i,i+15);const r=await rpc('fs_images',{p_ids:part});
    if(r&&r.ok!==false&&typeof r==='object'){for(const id of part){const p=prodById(id);if(r[id]&&p&&/^data:image\//.test(r[id])){imgs[id]={v:p.ver,d:r[id]};ch2=true}}}
  }
  if(ch2){LS.set('fs.imgs',imgs);softRender();}
}
setInterval(()=>{if(!document.hidden)refresh()},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
window.addEventListener('online',refresh);

/* ---------- helpers ---------- */
function pic(p,cls){
  const i=p&&p.has_image&&imgs[p.id];
  return i?`<img class="${cls}" src="${esc(i.d)}" alt="">`:`<span class="${cls}">${esc(p?p.emoji:'📝')}</span>`;
}
let tt;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}
function sheet(html){
  const w=$('wrap');w.innerHTML=`<div class="sheet">${html}</div>`;w.classList.add('on');
  w.onclick=e=>{if(e.target===w)closeSheet()};return w.firstChild;
}
function closeSheet(){$('wrap').classList.remove('on');setTimeout(()=>{if(!$('wrap').classList.contains('on'))$('wrap').innerHTML=''},200);if(pending)render()}
function ask(msg,okLabel,danger){
  return new Promise(res=>{
    const s=sheet(`<h2>${esc(msg)}</h2><div class="two"><button class="btn ghost" data-a="0">Cancel</button><button class="btn ${danger?'danger':''}" data-a="1">${esc(okLabel)}</button></div>`);
    s.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{closeSheet();res(b.dataset.a==='1')});
  });
}
function basketCount(){return Object.keys(basket.items).filter(id=>prodById(id)&&!prodById(id).hidden).length+basket.custom.length}

/* group active requests into lines: same product (or same custom text) + same bought state */
function lines(){
  const g={},notes=[];
  for(const r of S.requests){
    if(r.kind==='note'){notes.push(r);continue}
    const p=r.product_id?prodById(r.product_id):null;
    if(r.product_id&&!p)continue;
    const key=(r.bought?'b':'o')+(p?'p:'+p.id:'t:'+String(r.text||'').trim().toLowerCase());
    const L=g[key]||(g[key]={key,p,text:p?p.name:r.text,unit:p?p.unit:'piece',bought:r.bought,rows:[],total:0});
    L.rows.push(r);L.total+=+r.qty;
  }
  const order=L=>(L.p?(L.p.category==='food'?0:1):2);
  const all=Object.values(g).sort((a,b)=>order(a)-order(b)||String(a.text).localeCompare(String(b.text)));
  return{todo:all.filter(l=>!l.bought),done:all.filter(l=>l.bought),notes};
}
function whoChips(L,canCancel){
  const by={};
  for(const r of L.rows){const k=r.member_id||r.member_name;(by[k]=by[k]||{name:r.member_name,mid:r.member_id,qty:0,ids:[]});by[k].qty+=+r.qty;by[k].ids.push(r.id)}
  return `<div class="who-chips">${Object.values(by).map(w=>{
    const mine=canCancel&&w.mid===me&&!L.bought;

let pending=false;
function softRender(){
  const a=document.activeElement;
  if($('wrap').classList.contains('on')||(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'))){pending=true;return}
  render();
}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pending)softRender()},50));

function go(v){view=v;window.scrollTo(0,0);render()}

function render(){
  pending=false;
  const admin=view==='admin';
  const m=meM();
  // top
  let top='';
  if(admin)top=`<h1>⚙️ Admin</h1><button class="chip" data-go="exit">Done</button>`;
  else if(view==='pin')top=`<h1>🔒 Admin</h1><button class="chip" data-go="back">Back</button>`;

  $('top').innerHTML=top;

  // tabs
  const tabs=$('tabs');
  if(admin){
    const n=lines().todo.length;
    tabs.innerHTML=[['list','📋','Shopping list',n],['products','🍎','Products'],['family','👪','Family']]
      .map(([k,i,l,b])=>`<button class="${adminTab===k?'on':''}" data-tab="${k}"><span class="i">${i}</span>${l}${b?`<span class="badge">${b}</span>`:''}</button>`).join('');
    tabs.classList.remove('hidden');
  }else if(m&&['shop','basket','list'].includes(view)){
    const bc=basketCount(),lc=lines().todo.length;
    tabs.innerHTML=[['shop','🛒','Shop'],['basket','🧺','My basket',bc],['list','📋','Family list',lc]]
      .map(([k,i,l,b])=>`<button class="${view===k?'on':''}" data-go="${k}"><span class="i">${i}</span>${l}${b?`<span class="badge">${b}</span>`:''}</button>`).join('');
    tabs.classList.remove('hidden');
  }else tabs.classList.add('hidden');

  const app=$('app');
  if(view==='who')app.innerHTML=vWho();
  else if(view==='shop')app.innerHTML=vShop();
  else if(view==='basket')app.innerHTML=vBasket();
  else if(view==='list')app.innerHTML=vList();
  else if(view==='pin')app.innerHTML=vPin();
  else if(admin)app.innerHTML=adminTab==='list'?vAList():adminTab==='products'?vAProducts():vAFamily();
  updateBar();
  if(view==='pin')drawDots();
}
function updateBar(){
  const bar=$('bbar');const n=basketCount();
  const show=view==='shop'&&n>0&&meM();
  bar.classList.toggle('hidden',!show);$('app').classList.toggle('withbar',!!show);
  if(show)bar.innerHTML=`<span>🧺 ${n} item${n===1?'':'s'} in basket</span><span>View ›</span>`;

function changeQty(pid,dir){

async function send(btn){

async function pinKey(k){
  if(pinBusy)return;
  if(k==='⌫'){pinBuf=pinBuf.slice(0,-1);return drawDots()}
  if(pinBuf.length>=4)return;
  pinBuf+=k;drawDots();if(pinBuf.length<4)return;
  const v=pinBuf;
  if(pinMode==='create'){

    if(pinFirst!==v){pinFirst='';pinBuf='';setTimeout(drawDots,150);return setPinMsg('The PINs did not match. Start again.',true)}
    pinBusy=true;const r=await rpc('fs_set_pin',{p_pin:v});pinBusy=false;
    if(!r||!r.ok){pinFirst='';pinBuf='';pinMode='enter';render();return setPinMsg(r&&r.error==='pin_exists'?'A PIN already exists. Enter it.':ERR[r&&r.error]||ERR.server,true)}
  }
  pinBusy=true;const r=await rpc('fs_login',{p_pin:v});pinBusy=false;
  if(r&&r.ok){PIN=v;SS.set('fs.pin',v);S.has_pin=true;adminTab='list';go('admin');refresh();}
  else{pinBuf='';setTimeout(drawDots,150);setPinMsg(ERR[r&&r.error]||ERR.server,true)}

function resizeImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);const im=new Image();
    im.onload=()=>{const M=360;const s=Math.min(1,M/Math.max(im.width,im.height));
      const side=Math.min(im.width,im.height);const sx=(im.width-side)/2,sy=(im.height-side)/2;const out=Math.min(M,side);
      const c=document.createElement('canvas');c.width=out;c.height=out;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,out,out);
      g.drawImage(im,sx,sy,side,side,0,0,out,out);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.78));};
    im.onerror=()=>{URL.revokeObjectURL(url);rej()};im.src=url;
  });
}

  };
  s.querySelector('#psave').onclick=e=>save(false,e.currentTarget);
  const more=s.querySelector('#pmore');if(more)more.onclick=e=>save(true,e.currentTarget);
  const del=s.querySelector('#pdel');
  if(del)del.onclick=async()=>{if(await ask('Delete “'+p.name+'”? It will also leave the shopping list.','Delete',true)){const r=await arpc('fs_product_delete',{p_id:p.id});if(r.ok){toast('Deleted');await refresh();render()}}};
  if(!p)setTimeout(()=>s.querySelector('#pn').focus(),250);
}

/* admin: family */
function vAFamily(){
  return `<button class="btn block" data-medit="new">➕ Add family member</button>
    ${S.members.length?`<h3>Family (${S.members.length})</h3><div class="list">${S.members.map(m=>`<div class="row tap" data-medit="${esc(m.id)}"><span class="th">${esc(m.emoji)}</span><div class="bd"><div class="t">${esc(m.name)}</div></div><span class="muted">›</span></div>`).join('')}</div>`
      :`<div class="empty"><div class="big">👪</div><p>Add everyone who will pick food and drinks.</p></div>`}
    <p class="muted" style="margin:18px 4px;font-size:14px">Share this page's link with your family. They tap their name, pick what they want and press Send.</p>`;
}
function memberSheet(id){
  const m=id==='new'?null:S.members.find(x=>x.id===id);
  const f={name:m?m.name:'',emoji:m?m.emoji:'🙂'};
  const s=sheet(`<h2>${m?'Edit':'Add'} family member</h2>
    <label class="fl" for="mn">Name</label><input class="inp" id="mn" maxlength="40" placeholder="e.g. Sara" value="${esc(f.name)}">
    <label class="fl">Picture</label><div class="emos" id="me"></div>
    <div class="two">${m?`<button class="btn danger" id="mdel">Delete</button>`:`<button class="btn ghost" id="mcan">Cancel</button>`}<button class="btn" id="msave">Save</button></div>`);
  const draw=()=>s.querySelector('#me').innerHTML=FACE_EMO.map(e=>`<button data-v="${esc(e)}" class="${e===f.emoji?'on':''}">${esc(e)}</button>`).join('');
  draw();
  s.querySelector('#me').onclick=e=>{const b=e.target.closest('button');if(b){f.emoji=b.dataset.v;draw()}};
  const can=s.querySelector('#mcan');if(can)can.onclick=closeSheet;
  s.querySelector('#msave').onclick=async e=>{
    f.name=s.querySelector('#mn').value.trim();if(!f.name)return s.querySelector('#mn').focus();
    const btn=e.currentTarget;btn.disabled=true;
    const r=await arpc('fs_member_save',{p_id:m?m.id:null,p_name:f.name,p_emoji:f.emoji});
    if(r.ok){closeSheet();toast('Saved');await refresh();render()}else btn.disabled=false;
  };
  const del=s.querySelector('#mdel');
  if(del)del.onclick=async()=>{if(await ask('Remove '+m.name+' from the family list?','Remove',true)){const r=await arpc('fs_member_delete',{p_id:m.id});if(r.ok){toast('Removed');await refresh();render()}}};
  if(!m)setTimeout(()=>s.querySelector('#mn').focus(),250);
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  if(e.target.closest('#wrap'))return;
  const t=e.target.closest('button,[data-mark],[data-edit],[data-medit]');if(!t)return;
  const d=t.dataset;
  if(d.go){
    if(d.go==='admin')return openAdmin();
    if(d.go==='exit'||d.go==='back')return go(meM()?'shop':'who');
    if(d.go==='who')return go('who');
    justSent=false;return go(d.go);
  }
  if(d.tab){adminTab=d.tab;return go('admin')}
  if(d.me){me=d.me;LS.set('fs.me',me);justSent=false;return go('shop')}
  if(d.cat){cat=d.cat;LS.set('fs.cat',cat);document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.cat===cat));$('grid').innerHTML=gridHtml();return}
  if(d.inc)return changeQty(d.inc,1);
  if(d.dec)return changeQty(d.dec,-1);
  if(d.cinc||d.cdec){const i=+(d.cinc??d.cdec);const c=basket.custom[i];if(!c)return;c.qty+=d.cinc!==undefined?1:-1;if(c.qty<=0)basket.custom.splice(i,1);else c.qty=Math.min(c.qty,99);saveBasket();return render()}
  if(d.other)return otherSheet();
  if(t.id==='qx'){q='';return render()}
  if(t.id==='send')return send(t);
  if(t.id==='clear'){if(await ask('Finished shopping? This clears the whole list for everyone.','Clear list',true)){const r=await arpc('fs_clear',{});if(r.ok){toast('Fresh list ready ✨');await refresh();render()}}return}
  if(d.cancel){const ids=d.cancel.split(',');if(!await ask('Remove your request?','Remove',true))return;
    for(const id of ids)await rpc('fs_cancel',{p_member:me,p_id:id});ping();toast('Removed');await refresh();return render()}
  if(d.rm){e.stopPropagation();if(await ask('Remove '+(d.name==='this note'?'this note':'“'+d.name+'”')+' from the list?','Remove',true)){const r=await arpc('fs_remove',{p_ids:d.rm.split(',')});if(r.ok){await refresh();render()}}return}
  if(d.mark)return mark(d.mark.split(','),d.on==='1');
  if(d.edit)return productSheet(d.edit);
  if(d.medit)return memberSheet(d.medit);
  if(d.k!==undefined&&d.k!=='')return pinKey(d.k);
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){q=e.target.value;$('grid').innerHTML=gridHtml();$('seg').classList.toggle('hidden',!!q);$('qx').classList.toggle('hidden',!q)}
  if(e.target.id==='note'){basket.note=e.target.value.slice(0,300);saveBasket()}
});

render();refresh();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
